<style>
  /*
   * HOUSE ARENA REMIX
   * Camada mobile-first carregada após os estilos legados.
   */
  #view-house-arena {
    --arena-night: #090d1d;
    --arena-night-2: #111831;
    --arena-panel: rgba(17, 24, 49, 0.92);
    --arena-panel-2: rgba(28, 38, 72, 0.82);
    --arena-white: #f8fbff;
    --arena-muted-2: #9aa8c7;
    --arena-cyan: #4ce6ff;
    --arena-lime: #c9ff58;
    --arena-gold: #ffcb45;
    --arena-coral: #ff6e66;
    --arena-line-2: rgba(160, 184, 235, 0.18);
    --arena-shadow: 0 22px 60px rgba(5, 8, 24, 0.32);
    --arena-caption: clamp(0.625rem, 2.5vw, 0.72rem);
    position: relative;
    width: 100%;
    max-width: 100%;
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    overflow-x: clip;
    color: var(--arena-white);
    container-type: inline-size;
    -webkit-tap-highlight-color: transparent;
  }

  #view-house-arena *,
  #view-house-arena *::before,
  #view-house-arena *::after {
    box-sizing: border-box;
  }

  #view-house-arena button {
    min-height: 2.75rem;
    touch-action: manipulation;
  }

  #view-house-arena button:focus-visible {
    outline: 3px solid var(--arena-cyan);
    outline-offset: 3px;
  }

  #view-house-arena .arena-connection-status {
    min-height: 1.75rem;
    margin: 0 0 0.5rem auto;
    padding: 0.32rem 0.62rem;
    display: flex;
    width: max-content;
    max-width: 100%;
    align-items: center;
    gap: 0.4rem;
    border: 1px solid rgba(34, 197, 94, 0.2);
    border-radius: 999px;
    color: #166534;
    background: rgba(240, 253, 244, 0.9);
    font-size: clamp(0.62rem, 2.5vw, 0.72rem);
    line-height: 1;
  }

  #view-house-arena .arena-connection-status > span {
    width: 0.48rem;
    height: 0.48rem;
    flex: 0 0 0.48rem;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.14);
  }

  #view-house-arena .arena-connection-status.is-offline {
    color: #9a3412;
    border-color: rgba(249, 115, 22, 0.25);
    background: #fff7ed;
  }

  #view-house-arena .arena-connection-status.is-offline > span {
    background: #f97316;
    box-shadow: 0 0 0 0.2rem rgba(249, 115, 22, 0.14);
  }

  #view-house-arena .arena-connection-status.is-pending,
  #view-house-arena .arena-connection-status.is-syncing {
    color: #075985;
    border-color: rgba(14, 165, 233, 0.25);
    background: #f0f9ff;
  }

  #view-house-arena .arena-connection-status.is-pending > span,
  #view-house-arena .arena-connection-status.is-syncing > span {
    background: #0ea5e9;
  }

  #view-house-arena .arena-connection-status.is-syncing > span {
    animation: arena-remix-pulse 0.8s ease-in-out infinite alternate;
  }

  #view-house-arena .arena-hero {
    min-height: 13rem;
    margin: 0 0 0.75rem;
    padding:
      max(1.15rem, env(safe-area-inset-top))
      max(1rem, env(safe-area-inset-right))
      1.2rem
      max(1rem, env(safe-area-inset-left));
    gap: 0.75rem;
    border: 1px solid rgba(114, 221, 255, 0.22);
    border-radius: clamp(1.25rem, 5vw, 2rem);
    color: var(--arena-white);
    background:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      radial-gradient(circle at 86% 18%, rgba(76, 230, 255, 0.26), transparent 27%),
      radial-gradient(circle at 12% 105%, rgba(255, 110, 102, 0.25), transparent 35%),
      linear-gradient(135deg, #101a3c 0%, #2c1661 55%, #111a38 100%);
    background-size: 1.2rem 1.2rem, 1.2rem 1.2rem, auto, auto, auto;
    box-shadow: var(--arena-shadow);
  }

  #view-house-arena .arena-hero::before {
    width: 13rem;
    height: 13rem;
    inset: -6rem -4rem auto auto;
    border: 1px dashed rgba(76, 230, 255, 0.2);
  }

  #view-house-arena .arena-hero::after {
    width: 8rem;
    height: 8rem;
    inset: auto auto -5rem 32%;
    border-color: rgba(255, 203, 69, 0.15);
  }

  #view-house-arena .arena-hero-copy {
    min-width: 0;
  }

  #view-house-arena .arena-kicker {
    max-width: 100%;
    padding: 0.38rem 0.55rem;
    color: var(--arena-cyan);
    border-color: rgba(76, 230, 255, 0.26);
    background: rgba(4, 10, 28, 0.36);
    font-size: clamp(0.52rem, 2.2vw, 0.66rem);
    letter-spacing: 0.11em;
  }

  #view-house-arena .arena-hero h2 {
    margin: 0.65rem 0 0.38rem;
    color: #fff;
    font-size: clamp(2rem, 10vw, 3.8rem);
    line-height: 0.9;
    letter-spacing: -0.06em;
  }

  #view-house-arena .arena-hero h2 em {
    display: block;
    color: var(--arena-lime);
    font-size: 0.5em;
    font-style: normal;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #view-house-arena .arena-hero p {
    max-width: 42rem;
    margin: 0;
    color: #c8d4ed;
    font-size: clamp(0.72rem, 3vw, 0.92rem);
    line-height: 1.5;
  }

  #view-house-arena .arena-hero-pills {
    margin-top: 0.75rem;
    gap: 0.38rem;
  }

  #view-house-arena .arena-hero-pills span {
    padding: 0.42rem 0.55rem;
    color: #ecf4ff;
    border: 1px solid rgba(176, 200, 255, 0.13);
    border-radius: 0.65rem;
    background: rgba(4, 10, 28, 0.38);
    font-size: clamp(0.56rem, 2.3vw, 0.7rem);
  }

  #view-house-arena .arena-hero-art {
    width: 5.4rem;
    height: 8rem;
    flex: 0 0 5.4rem;
  }

  #view-house-arena .arena-trophy {
    font-size: clamp(3.4rem, 16vw, 6.4rem);
  }

  #view-house-arena .arena-burst {
    width: 6rem;
    height: 6rem;
    background: repeating-conic-gradient(
      rgba(201, 255, 88, 0.5) 0deg 7deg,
      transparent 7deg 22deg
    );
  }

  #view-house-arena .arena-orbit {
    width: 2.15rem;
    height: 2.15rem;
    border-radius: 0.7rem;
    font-size: 1.15rem;
  }

  #view-house-arena .arena-game-picker-shell {
    width: 100%;
    max-width: 100%;
    margin: 0 0 0.75rem;
    padding: 1rem 0 1rem 0.9rem;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    background: var(--surface);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
  }

  #view-house-arena .arena-picker-head {
    margin-bottom: 0.72rem;
    padding-right: 0.9rem;
  }

  #view-house-arena .arena-picker-head h3 {
    margin-top: 0.12rem;
    font-size: clamp(1rem, 4.8vw, 1.35rem);
    letter-spacing: -0.035em;
  }

  #view-house-arena .arena-picker-head > span {
    display: none;
  }

  #view-house-arena .arena-game-filters {
    width: 100%;
    margin-bottom: 0.68rem;
    padding: 0 0.9rem 0.25rem 0;
    display: flex;
    gap: 0.38rem;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scrollbar-width: none;
  }

  #view-house-arena .arena-game-filters::-webkit-scrollbar,
  #view-house-arena .arena-game-grid::-webkit-scrollbar {
    display: none;
  }

  #view-house-arena .arena-game-filters button {
    min-width: max-content;
    min-height: 2.75rem;
    padding: 0 0.72rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface-2);
    font: inherit;
    font-size: 0.68rem;
    font-weight: 800;
  }

  #view-house-arena .arena-game-filters button.active {
    color: #fff;
    border-color: #312e81;
    background: linear-gradient(135deg, #312e81, #7c3aed);
    box-shadow: 0 0.45rem 1rem rgba(76, 29, 149, 0.2);
  }

  #view-house-arena .arena-game-grid {
    width: 100%;
    padding: 0.08rem 0.9rem 0.35rem 0;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(14.6rem, 82%);
    grid-template-columns: none;
    gap: 0.58rem;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scroll-padding-inline: 0.9rem;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }

  #view-house-arena .arena-game-card,
  #view-house-arena .arena-game-card:nth-child(n + 5) {
    position: relative;
    width: 100%;
    min-width: 0;
    min-height: 5.4rem;
    padding: 0.72rem;
    display: grid;
    grid-template-columns: 3.25rem minmax(0, 1fr) 1.25rem;
    align-items: center;
    gap: 0.68rem;
    overflow: hidden;
    scroll-snap-align: start;
    border: 1px solid color-mix(in srgb, var(--game-accent) 30%, var(--line));
    border-radius: 1rem;
    color: var(--text);
    background:
      radial-gradient(circle at 5% 50%, color-mix(in srgb, var(--game-accent) 14%, transparent), transparent 42%),
      var(--surface);
    box-shadow: 0 0.5rem 1.25rem rgba(15, 23, 42, 0.06);
    text-align: left;
  }

  #view-house-arena .arena-game-card::after {
    position: absolute;
    inset: auto 0 0;
    height: 0.22rem;
    content: "";
    background: var(--game-accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s ease;
  }

  #view-house-arena .arena-game-card.active {
    border-color: var(--game-accent);
    box-shadow:
      0 0.7rem 1.5rem color-mix(in srgb, var(--game-accent) 16%, transparent),
      inset 0 0 0 1px color-mix(in srgb, var(--game-accent) 34%, transparent);
    transform: none;
  }

  #view-house-arena .arena-game-card.active::after {
    transform: scaleX(1);
  }

  #view-house-arena .arena-game-card .arena-card-icon {
    width: 3.25rem;
    height: 3.25rem;
    display: grid;
    place-items: center;
    border: 1px solid color-mix(in srgb, var(--game-accent) 28%, transparent);
    border-radius: 0.95rem;
    background: color-mix(in srgb, var(--game-accent) 12%, var(--surface));
    font-size: 1.75rem;
  }

  #view-house-arena .arena-game-card .arena-card-copy {
    min-width: 0;
    display: block;
  }

  #view-house-arena .arena-game-card .arena-card-copy strong {
    display: block;
    overflow: hidden;
    color: var(--text);
    font-size: clamp(0.78rem, 3.4vw, 0.92rem);
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #view-house-arena .arena-game-card .arena-card-copy small {
    display: block;
    margin-top: 0.25rem;
    color: var(--muted);
    font-size: clamp(0.6rem, 2.5vw, 0.7rem);
  }

  #view-house-arena .arena-game-card > i {
    color: var(--game-accent);
    font-size: 1.35rem;
    font-style: normal;
  }

  #view-house-arena .arena-dashboard {
    width: 100%;
    max-width: 100%;
    display: block;
  }

  #view-house-arena .arena-game-shell,
  #view-house-arena .arena-ranking-shell {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 1.25rem;
  }

  #view-house-arena .arena-game-shell {
    min-height: 0;
    overflow: hidden;
    background: var(--surface);
  }

  #view-house-arena .arena-lobby {
    min-height: 0;
    padding: clamp(1.15rem, 5vw, 2.3rem) clamp(0.85rem, 4vw, 2.2rem);
    align-items: stretch;
    justify-content: flex-start;
    background:
      radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--selected-game) 15%, transparent), transparent 35%),
      var(--surface);
  }

  #view-house-arena .arena-game-brand {
    align-self: center;
    gap: 0.7rem;
  }

  #view-house-arena .arena-game-icon {
    width: 3.6rem;
    height: 3.6rem;
    flex: 0 0 3.6rem;
    border-color: color-mix(in srgb, var(--selected-game) 34%, var(--line));
    border-radius: 1rem;
    background: color-mix(in srgb, var(--selected-game) 12%, var(--surface));
    box-shadow: 0 0.7rem 1.4rem color-mix(in srgb, var(--selected-game) 14%, transparent);
    font-size: 1.9rem;
  }

  #view-house-arena .arena-game-brand span:not(.arena-game-icon) {
    color: var(--selected-game);
    font-size: 0.58rem;
  }

  #view-house-arena .arena-game-brand h3 {
    max-width: 16rem;
    margin-top: 0.2rem;
    overflow-wrap: anywhere;
    color: var(--text);
    font-size: clamp(1.35rem, 6.5vw, 2rem);
    line-height: 1;
  }

  #view-house-arena .arena-game-intro {
    max-width: 36rem;
    margin: 0.9rem auto 0.65rem;
    color: var(--muted);
    font-size: clamp(0.72rem, 3vw, 0.86rem);
    line-height: 1.5;
  }

  #view-house-arena .arena-selected-meta {
    margin: 0 auto 0.85rem;
    display: flex;
    max-width: 38rem;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.34rem;
  }

  #view-house-arena .arena-selected-meta span {
    padding: 0.35rem 0.55rem;
    border: 1px solid color-mix(in srgb, var(--selected-game) 26%, var(--line));
    border-radius: 999px;
    color: color-mix(in srgb, var(--selected-game) 82%, var(--text));
    background: color-mix(in srgb, var(--selected-game) 8%, var(--surface));
    font-size: 0.62rem;
    font-weight: 800;
  }

  #view-house-arena .arena-lobby-stats {
    max-width: 38rem;
    gap: 0.4rem;
  }

  #view-house-arena .arena-lobby-stats > div {
    min-width: 0;
    min-height: 4rem;
    padding: 0.7rem 0.25rem;
    justify-content: center;
    border-radius: 0.85rem;
    text-align: center;
  }

  #view-house-arena .arena-lobby-stats small {
    font-size: clamp(0.52rem, 2.1vw, 0.63rem);
  }

  #view-house-arena .arena-lobby-stats strong {
    color: var(--selected-game);
    font-size: clamp(1.05rem, 5vw, 1.45rem);
  }

  #view-house-arena .arena-how-to {
    max-width: 38rem;
    margin-top: 0.7rem;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.35rem;
  }

  #view-house-arena .arena-how-to span {
    min-width: 0;
    padding: 0.5rem 0.2rem;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0.3rem;
    border: 1px dashed var(--line);
    border-radius: 0.75rem;
    font-size: clamp(0.54rem, 2.25vw, 0.65rem);
    line-height: 1.2;
    text-align: center;
  }

  #view-house-arena .arena-how-to b {
    width: 1.3rem;
    height: 1.3rem;
    flex: 0 0 1.3rem;
    border-radius: 0.42rem;
    background: var(--selected-game);
  }

  #view-house-arena .arena-ranked-status {
    width: 100%;
    max-width: 38rem;
    margin: 0.72rem auto 0;
    padding: 0.58rem 0.7rem;
    border: 1px solid rgba(249, 115, 22, 0.16);
    border-radius: 0.75rem;
    font-size: clamp(0.6rem, 2.5vw, 0.72rem);
    line-height: 1.35;
    text-align: center;
  }

  #view-house-arena .arena-resume-banner {
    position: relative;
    width: 100%;
    max-width: 38rem;
    margin: 0.65rem auto 0;
    padding: 0.65rem 3.1rem 0.65rem 0.7rem;
    display: grid;
    grid-template-columns: 2.3rem minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.55rem;
    border: 1px solid rgba(14, 165, 233, 0.28);
    border-radius: 0.85rem;
    color: #0c4a6e;
    background: #f0f9ff;
    text-align: left;
  }

  #view-house-arena .arena-resume-banner > span {
    width: 2.3rem;
    height: 2.3rem;
    display: grid;
    place-items: center;
    border-radius: 0.7rem;
    color: #fff;
    background: #0ea5e9;
    font-size: 1rem;
  }

  #view-house-arena .arena-resume-banner div {
    min-width: 0;
  }

  #view-house-arena .arena-resume-banner strong,
  #view-house-arena .arena-resume-banner small {
    display: block;
  }

  #view-house-arena .arena-resume-banner strong {
    font-size: 0.72rem;
  }

  #view-house-arena .arena-resume-banner small {
    margin-top: 0.13rem;
    color: #0369a1;
    font-size: 0.6rem;
    line-height: 1.25;
  }

  #view-house-arena .arena-resume-banner button {
    min-height: 2.75rem;
    padding: 0 0.68rem;
    border: 0;
    border-radius: 0.65rem;
    color: #fff;
    background: #0284c7;
    font: inherit;
    font-size: 0.65rem;
    font-weight: 900;
  }

  #view-house-arena #arenaDiscardResumeBtn {
    position: absolute;
    inset: 0.25rem 0.25rem auto auto;
    width: 2.75rem;
    min-height: 2.75rem;
    padding: 0;
    color: #0369a1;
    background: transparent;
    font-size: 1rem;
  }

  #view-house-arena .arena-lobby-actions {
    width: 100%;
    max-width: 38rem;
    margin: 0.7rem auto 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.25rem 3.25rem;
    gap: 0.45rem;
  }

  #view-house-arena .arena-lobby-actions > * {
    min-width: 0;
    max-width: 100%;
    margin: 0;
  }

  #view-house-arena #arenaGameShell .arena-start-btn {
    width: 100%;
    min-width: 0;
    height: 3.25rem;
    padding-inline: 0.7rem;
    border-radius: 0.9rem;
    color: #fff;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--selected-game) 88%, #fff),
      color-mix(in srgb, var(--selected-game) 70%, #5b21b6)
    );
    box-shadow: 0 0.75rem 1.5rem color-mix(in srgb, var(--selected-game) 22%, transparent);
  }

  #view-house-arena .arena-start-btn b {
    overflow: hidden;
    font-size: clamp(0.68rem, 2.8vw, 0.82rem);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #view-house-arena .arena-sound-btn,
  #view-house-arena .arena-settings-btn {
    width: 3.25rem;
    min-width: 3.25rem;
    height: 3.25rem;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 0.9rem;
  }

  #view-house-arena .arena-sound-btn > b,
  #view-house-arena .arena-settings-btn > b {
    display: none;
  }

  #view-house-arena .arena-sound-btn > span,
  #view-house-arena .arena-settings-btn > span {
    font-size: 1.1rem;
    line-height: 1;
  }

  #view-house-arena .arena-ranking-shell {
    margin-top: 0.75rem;
    padding: 0.9rem;
    background: var(--surface);
  }

  /* Modo de partida */
  #view-house-arena.arena-game-active {
    padding:
      env(safe-area-inset-top)
      env(safe-area-inset-right)
      env(safe-area-inset-bottom)
      env(safe-area-inset-left);
  }

  #view-house-arena.arena-game-active .arena-connection-status,
  #view-house-arena.arena-game-active .arena-hero,
  #view-house-arena.arena-game-active .arena-game-picker-shell,
  #view-house-arena.arena-game-active .arena-ranking-shell {
    display: none;
  }

  #view-house-arena.arena-game-active .arena-dashboard {
    display: block;
  }

  #view-house-arena.arena-game-active .arena-game-shell {
    margin: 0;
    border: 0;
    border-radius: clamp(0.8rem, 3vw, 1.25rem);
    background: var(--arena-night);
    box-shadow: 0 1rem 3rem rgba(5, 8, 24, 0.35);
  }

  #view-house-arena .arena-play {
    min-height: min(
      calc(var(--arena-vh, 1vh) * 100 - 5.75rem),
      58rem
    );
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--arena-white);
    background:
      radial-gradient(circle at 50% -10%, rgba(124, 58, 237, 0.22), transparent 38%),
      var(--arena-night);
  }

  #view-house-arena .arena-play-title {
    position: relative;
    z-index: 12;
    min-height: 3.25rem;
    padding: 0.45rem 0.55rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(170, 193, 241, 0.12);
    color: #dbe7ff;
    background: rgba(9, 13, 29, 0.93);
    backdrop-filter: blur(0.8rem);
  }

  #view-house-arena .arena-play-title > div {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  #view-house-arena .arena-play-title > div:last-child {
    justify-content: flex-end;
  }
