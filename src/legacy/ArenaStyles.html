<style>
  /* House Arena — jogo leve, sem imagens externas. */
  #view-house-arena {
    --arena-purple: #7c3aed;
    --arena-violet: #5b21b6;
    --arena-pink: #ec4899;
    --arena-orange: #f97316;
    --arena-yellow: #fbbf24;
    --arena-green: #22c55e;
    --arena-red: #ef4444;
    --arena-ink: #24133f;
  }

  .arena-nav-icon svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arena-nav-icon circle {
    fill: currentColor;
    stroke: none;
  }

  .arena-hero {
    position: relative;
    min-height: 220px;
    margin-bottom: 18px;
    padding: 34px 38px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 26px;
    color: #fff;
    background:
      radial-gradient(circle at 90% 20%, rgba(251, 191, 36, 0.34), transparent 25%),
      radial-gradient(circle at 74% 115%, rgba(236, 72, 153, 0.48), transparent 40%),
      linear-gradient(125deg, #351070 0%, #6d28d9 48%, #9f2e9c 100%);
    box-shadow: 0 18px 45px rgba(91, 33, 182, 0.2);
    isolation: isolate;
  }

  .arena-hero::before,
  .arena-hero::after {
    position: absolute;
    z-index: -1;
    content: "";
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .arena-hero::before {
    width: 330px;
    height: 330px;
    right: -90px;
    top: -185px;
  }

  .arena-hero::after {
    width: 210px;
    height: 210px;
    right: 230px;
    bottom: -175px;
  }

  .arena-hero-copy {
    position: relative;
    z-index: 2;
    max-width: 700px;
  }

  .arena-kicker {
    display: inline-flex;
    padding: 7px 11px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 999px;
    color: #fef3c7;
    background: rgba(255, 255, 255, 0.1);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.13em;
  }

  .arena-hero h2 {
    margin: 11px 0 5px;
    color: #fff;
    font-size: clamp(34px, 4vw, 54px);
    line-height: 0.98;
    letter-spacing: -0.05em;
  }

  .arena-hero p {
    max-width: 580px;
    margin: 0;
    color: rgba(255, 255, 255, 0.82);
    font-size: 13px;
    line-height: 1.6;
  }

  .arena-hero-pills {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .arena-hero-pills span {
    padding: 8px 11px;
    border-radius: 10px;
    background: rgba(17, 7, 39, 0.24);
    font-size: 10px;
    font-weight: 800;
    backdrop-filter: blur(5px);
  }

  .arena-hero-art {
    position: relative;
    width: 210px;
    height: 160px;
    flex: 0 0 210px;
    display: grid;
    place-items: center;
  }

  .arena-trophy {
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 18px 18px rgba(24, 8, 50, 0.38));
    font-size: 82px;
    animation: arena-trophy-float 2.6s ease-in-out infinite;
  }

  .arena-burst {
    position: absolute;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(251, 191, 36, 0.55) 0deg 9deg,
      transparent 9deg 24deg
    );
    animation: arena-spin 18s linear infinite;
  }

  .arena-orbit {
    position: absolute;
    z-index: 3;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, 0.55);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 10px 22px rgba(24, 8, 50, 0.2);
    font-size: 25px;
    backdrop-filter: blur(8px);
  }

  .arena-orbit-one {
    left: 1px;
    top: 5px;
    animation: arena-orbit-one 4.5s ease-in-out infinite;
  }

  .arena-orbit-two {
    right: 1px;
    top: 24px;
    animation: arena-orbit-two 4s ease-in-out infinite;
  }

  .arena-orbit-three {
    left: 22px;
    bottom: -1px;
    animation: arena-orbit-three 4.2s ease-in-out infinite;
  }

  .arena-dashboard {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(330px, 0.65fr);
    gap: 18px;
    align-items: start;
  }

  .arena-game-shell,
  .arena-ranking-shell {
    border-radius: 22px;
    overflow: hidden;
  }

  .arena-game-shell {
    min-height: 620px;
    padding: 0;
    position: relative;
  }

  .arena-lobby {
    min-height: 620px;
    padding: 45px clamp(24px, 5vw, 62px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      radial-gradient(circle at 50% 3%, rgba(124, 58, 237, 0.13), transparent 35%),
      var(--surface);
  }

  .arena-game-brand {
    display: flex;
    align-items: center;
    gap: 13px;
    text-align: left;
  }

  .arena-game-icon {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border: 1px solid #fed7aa;
    border-radius: 20px;
    background: linear-gradient(145deg, #fff7ed, #ffedd5);
    box-shadow: 0 12px 28px rgba(249, 115, 22, 0.17);
    font-size: 34px;
    animation: arena-bell 3.4s ease-in-out infinite;
  }

  .arena-game-brand span:not(.arena-game-icon) {
    color: var(--arena-orange);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.14em;
  }

  .arena-game-brand h3 {
    margin: 2px 0 0;
    color: var(--text);
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: -0.035em;
  }

  .arena-game-intro {
    max-width: 570px;
    margin: 20px 0 22px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }

  .arena-lobby-stats,
  .arena-ranking-summary {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
  }

  .arena-lobby-stats {
    max-width: 600px;
  }

  .arena-lobby-stats > div,
  .arena-ranking-summary > div {
    padding: 14px 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--surface-2);
  }

  .arena-lobby-stats small,
  .arena-ranking-summary small {
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .arena-lobby-stats strong {
    color: var(--arena-purple);
    font-size: 22px;
    line-height: 1;
  }

  .arena-how-to {
    width: 100%;
    max-width: 600px;
    margin-top: 13px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .arena-how-to span {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
  }

  .arena-how-to b {
    width: 20px;
    height: 20px;
    display: grid;
    flex: 0 0 20px;
    place-items: center;
    border-radius: 7px;
    color: #fff;
    background: var(--arena-purple);
    font-size: 9px;
  }

  .arena-ranked-status {
    margin-top: 21px;
    padding: 9px 12px;
    border-radius: 999px;
    color: #7c2d12;
    background: #ffedd5;
    font-size: 10px;
    font-weight: 800;
  }

  .arena-ranked-status span {
    margin-right: 4px;
  }

  .arena-lobby-actions,
  .arena-result-actions {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 9px;
  }

  .arena-start-btn {
    min-width: 210px;
    height: 48px;
    border: 0;
    background: linear-gradient(135deg, var(--arena-orange), var(--arena-pink));
    box-shadow: 0 12px 24px rgba(236, 72, 153, 0.22);
  }

  .arena-start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(236, 72, 153, 0.3);
  }

  .arena-start-btn.is-loading span {
    display: inline-block;
    animation: arena-spin 0.8s linear infinite;
  }

  .arena-sound-btn {
    min-width: 82px;
  }

  .arena-sound-btn.is-muted {
    opacity: 0.68;
  }

  .arena-play {
    min-height: 620px;
    background: #1f1038;
  }

  .arena-hud {
    padding: 15px 18px 13px;
    display: grid;
    grid-template-columns: 1fr 0.8fr 1fr;
    gap: 10px;
    color: #fff;
    background: linear-gradient(90deg, #2d1552, #4c1d95, #2d1552);
  }

  .arena-hud-item {
    text-align: center;
  }

  .arena-hud-item span {
    display: block;
    color: #c4b5fd;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.14em;
  }

  .arena-hud-item strong {
    display: block;
    margin-top: 2px;
    font-size: 24px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.18s, transform 0.18s;
  }

  .arena-hud-item strong.is-turbo {
    color: #fde047;
    transform: scale(1.12);
    text-shadow: 0 0 18px rgba(253, 224, 71, 0.55);
  }

  .arena-hud-timer {
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.17);
  }

  #arenaTimer.is-urgent {
    color: #fda4af;
    animation: arena-timer-pulse 0.55s ease-in-out infinite alternate;
  }

  .arena-timer-track {
    height: 6px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.3);
  }

  .arena-timer-track i {
    width: 100%;
    height: 100%;
    display: block;
    transform: scaleX(1);
    transform-origin: left center;
    background: linear-gradient(90deg, #22c55e, #fde047, #f97316);
    transition: background 0.2s;
  }

  .arena-timer-track i.is-urgent {
    background: linear-gradient(90deg, #ef4444, #fb7185);
  }

  .arena-stage {
    position: relative;
    min-height: 545px;
    padding: 26px 25px 72px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    background:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, #5b21b6 0, #291449 48%, #170d29 100%);
    background-size: 30px 30px, 30px 30px, auto;
  }

  .arena-stage-lights {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 25%, rgba(251, 191, 36, 0.13) 42%, transparent 56%),
      linear-gradient(245deg, transparent 25%, rgba(236, 72, 153, 0.13) 42%, transparent 56%);
    animation: arena-lights 4.5s ease-in-out infinite alternate;
  }

  .arena-order-ticket {
    position: relative;
    z-index: 2;
    width: min(310px, 82%);
    padding: 15px 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 2px solid #fed7aa;
    border-radius: 18px;
    color: #4a2508;
    background:
      linear-gradient(90deg, transparent 12px, rgba(249, 115, 22, 0.08) 12px 13px, transparent 13px),
      #fff7ed;
    box-shadow: 0 16px 35px rgba(6, 2, 16, 0.34);
    transform-origin: top center;
  }

  .arena-order-ticket::before,
  .arena-order-ticket::after {
    position: absolute;
    top: -8px;
    width: 15px;
    height: 15px;
    content: "";
    border-radius: 50%;
    background: #4c1d95;
  }

  .arena-order-ticket::before {
    left: -7px;
  }

  .arena-order-ticket::after {
    right: -7px;
  }

  .arena-order-ticket > span {
    color: #9a3412;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.12em;
  }

  .arena-order-ticket > small {
    margin-top: 2px;
    color: #9a3412;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.11em;
  }

  .arena-order-ticket > strong {
    margin-top: 1px;
    font-size: 21px;
    text-align: center;
  }

  .arena-order-emoji {
    margin: 3px 0 -1px;
    filter: drop-shadow(0 8px 9px rgba(124, 45, 18, 0.18));
    font-size: 54px;
  }

  .arena-ticket-pop {
    animation: arena-ticket-pop 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }

  .arena-feedback {
    position: relative;
    z-index: 6;
    min-height: 31px;
    margin: 8px 0 4px;
    font-size: 22px;
    font-weight: 1000;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.32);
  }

  .arena-feedback.is-correct {
    color: #86efac;
  }

  .arena-feedback.is-wrong {
    color: #fda4af;
  }

  .arena-feedback-pop {
    animation: arena-feedback-pop 0.55s cubic-bezier(0.2, 1.55, 0.45, 1);
  }

  .arena-choices {
    position: relative;
    z-index: 4;
    width: min(680px, 100%);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .arena-choice {
    min-width: 0;
    min-height: 138px;
    padding: 13px 7px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 2px solid rgba(255, 255, 255, 0.11);
    border-radius: 18px;
    color: #fff;
    background:
      radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--choice-color) 24%, transparent), transparent 55%),
      rgba(255, 255, 255, 0.075);
    box-shadow: 0 12px 24px rgba(8, 3, 18, 0.2);
    cursor: pointer;
    backdrop-filter: blur(5px);
    animation: arena-choice-in 0.32s both;
    animation-delay: var(--choice-delay);
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .arena-choice:hover:not(:disabled) {
    transform: translateY(-4px) scale(1.025);
    border-color: color-mix(in srgb, var(--choice-color) 70%, #fff);
    background-color: rgba(255, 255, 255, 0.13);
  }

  .arena-choice:active:not(:disabled) {
    transform: translateY(1px) scale(0.97);
  }

  .arena-choice > span {
    filter: drop-shadow(0 9px 7px rgba(0, 0, 0, 0.23));
    font-size: clamp(42px, 5vw, 58px);
  }

  .arena-choice > strong {
    min-height: 29px;
    display: grid;
    place-items: center;
    font-size: 10px;
    line-height: 1.25;
    text-align: center;
  }

  .arena-choice > small {
    color: #c4b5fd;
    font-size: 7px;
    font-weight: 900;
    letter-spacing: 0.14em;
  }

  .arena-choice.is-correct {
    border-color: #86efac;
    background: rgba(34, 197, 94, 0.27);
    animation: arena-correct 0.28s ease-out;
  }

  .arena-choice.is-wrong {
    border-color: #fda4af;
    background: rgba(239, 68, 68, 0.27);
    animation: arena-wrong 0.28s ease-out;
  }

  .arena-choice.is-answer {
    box-shadow: 0 0 0 3px rgba(134, 239, 172, 0.25);
  }

  .arena-conveyor {
    position: absolute;
    z-index: 1;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50px;
    overflow: hidden;
    display: flex;
    gap: 38px;
    align-items: center;
    border-top: 5px solid #17101f;
    border-bottom: 5px solid #17101f;
    background: repeating-linear-gradient(90deg, #4b5563 0 25px, #374151 25px 50px);
  }

  .arena-conveyor i {
    width: 29px;
    height: 29px;
    flex: 0 0 29px;
    border: 5px solid #1f2937;
    border-radius: 50%;
    background: #9ca3af;
    animation: arena-conveyor 1.7s linear infinite;
  }

  .arena-particles {
    position: absolute;
    z-index: 9;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .arena-particles i {
    position: absolute;
    font-style: normal;
    font-size: 22px;
    animation: arena-particle 0.85s cubic-bezier(0.1, 0.7, 0.25, 1) forwards;
  }

  .arena-countdown {
    position: absolute;
    z-index: 20;
    inset: 0;
    display: grid;
    place-items: center;
    color: #fff;
    background: rgba(22, 8, 41, 0.83);
    font-size: clamp(80px, 13vw, 150px);
    font-weight: 1000;
    letter-spacing: -0.08em;
    backdrop-filter: blur(7px);
  }

  .arena-count-pop {
    animation: arena-count-pop 0.68s cubic-bezier(0.18, 0.9, 0.28, 1);
  }

  .arena-stage-shake {
    animation: arena-stage-shake 0.3s ease-out;
  }

  .arena-stage-finished::after {
    position: absolute;
    z-index: 12;
    inset: 0;
    content: "TEMPO!";
    display: grid;
    place-items: center;
    color: #fff;
    background: rgba(29, 12, 52, 0.76);
    font-size: clamp(48px, 9vw, 92px);
    font-weight: 1000;
    letter-spacing: -0.07em;
    backdrop-filter: blur(5px);
    animation: arena-finish-in 0.35s ease-out;
  }

  .arena-result {
    min-height: 620px;
    padding: 42px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      radial-gradient(circle at 50% 15%, rgba(251, 191, 36, 0.2), transparent 28%),
      radial-gradient(circle at 50% 110%, rgba(124, 58, 237, 0.13), transparent 38%),
      var(--surface);
  }

  .arena-result-crown {
    font-size: 72px;
    filter: drop-shadow(0 12px 15px rgba(245, 158, 11, 0.25));
    animation: arena-result-crown 1.2s ease-in-out infinite alternate;
  }

  .arena-result > span {
    margin-top: 7px;
    color: var(--arena-orange);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.14em;
  }

  .arena-result h3 {
    margin: 4px 0 0;
    font-size: clamp(24px, 4vw, 38px);
  }

  .arena-result > strong {
    margin-top: 8px;
    color: var(--arena-purple);
    font-size: clamp(56px, 8vw, 86px);
    line-height: 0.95;
    letter-spacing: -0.06em;
  }

  .arena-result > small {
    color: var(--muted);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.13em;
  }

  .arena-result-grid {
    width: min(520px, 100%);
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }

  .arena-result-grid > div {
    padding: 13px 8px;
    display: grid;
    gap: 2px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface-2);
  }

  .arena-result-grid span {
    font-size: 17px;
  }

  .arena-result-grid b {
    font-size: 18px;
  }

  .arena-result-grid small {
    color: var(--muted);
    font-size: 8px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .arena-result > p {
    margin: 17px 0 0;
    color: var(--muted);
    font-size: 10px;
  }

  .arena-ranking-shell {
    padding: 18px;
    position: sticky;
    top: 88px;
  }

  .arena-ranking-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .arena-ranking-head h3 {
    margin: 1px 0 0;
    font-size: 23px;
  }

  .arena-ranking-head .icon-btn {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 11px;
    color: var(--text);
    background: var(--surface-2);
    cursor: pointer;
  }

  .arena-ranking-head .icon-btn.is-spinning {
    animation: arena-spin 0.8s linear infinite;
  }

  .arena-ranking-summary {
    margin: 14px 0 12px;
  }

  .arena-ranking-summary > div {
    padding: 10px 6px;
    text-align: center;
  }

  .arena-ranking-summary strong {
    color: var(--arena-purple);
    font-size: 16px;
    line-height: 1;
  }

  .arena-tab-row {
    padding: 3px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    border-radius: 10px;
    background: var(--surface-2);
  }

  .arena-tab-row button {
    min-width: 0;
    padding: 7px 3px;
    border: 0;
    border-radius: 8px;
    color: var(--muted);
    background: transparent;
    font-size: 8.5px;
    font-weight: 800;
    cursor: pointer;
  }

  .arena-tab-row button.active {
    color: #fff;
    background: linear-gradient(135deg, var(--arena-purple), var(--arena-pink));
    box-shadow: 0 5px 12px rgba(124, 58, 237, 0.18);
  }

  .arena-scope-tabs {
    margin-top: 7px;

  .arena-ranking-label {
    margin: 15px 2px 7px;

    font-weight: 900;
    text-transform: uppercase;

  .arena-ranking-list {

    gap: 6px;

  .arena-rank-row {

    padding: 9px 7px;

    grid-template-columns: 28px 34px minmax(0, 1fr) auto;
    align-items: center;
    gap: 7px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--surface-2);
    transition: transform 0.16s, border-color 0.16s;

  .arena-rank-row:hover {

  .arena-rank-row.podium {

  }

  .arena-rank-row.is-mine {

  .arena-rank-position {

    font-weight: 900;

  .arena-rank-avatar {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 11px;

    font-weight: 900;

  .arena-unit-avatar {
    color: inherit;

  .arena-rank-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .arena-rank-copy strong {
    overflow: hidden;
    font-size: 10px;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .arena-rank-copy strong em {
    margin-left: 3px;
    padding: 2px 4px;
    border-radius: 4px;
    color: var(--arena-purple);
    background: var(--primary-soft);
    font-size: 6px;
    font-style: normal;
  }

  .arena-rank-copy small {
    overflow: hidden;
    color: var(--muted);
    font-size: 8px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .arena-rank-copy i {
    width: var(--arena-progress);
    height: 3px;
    max-width: 100%;
    margin-top: 5px;
    display: block;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--arena-purple), var(--arena-pink));
  }

  .arena-rank-score {
    min-width: 48px;
    text-align: right;
  }

  .arena-rank-score strong {
    display: block;
    color: var(--arena-purple);
    font-size: 11px;
  }

  .arena-rank-score small {
    display: block;
    color: var(--muted);
    font-size: 7px;
  }

  .arena-ranking-loading,
  .arena-ranking-empty {
    min-height: 120px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--muted);
    text-align: center;
  }

  .arena-ranking-loading i {
    width: 25px;
    height: 25px;
    border: 3px solid var(--line);
    border-top-color: var(--arena-purple);
    border-radius: 50%;
    animation: arena-spin 0.7s linear infinite;
  }

  .arena-ranking-loading span,
  .arena-ranking-empty p {
    margin: 0;
    font-size: 9px;
  }

  .arena-ranking-empty > span {
    font-size: 28px;
  }

  .arena-ranking-empty strong {
    color: var(--text);
    font-size: 11px;
  }

  .arena-ranking-note {
    margin: 11px 2px 0;
    color: var(--muted);
    font-size: 8px;
    line-height: 1.5;
  }

  [data-theme="dark"] .arena-game-icon,
  [data-theme="dark"] .arena-unit-avatar {
    border-color: #78350f;
    background: #3b200f;
  }

  [data-theme="dark"] .arena-ranked-status {
    color: #fed7aa;
    background: #431d0c;
  }

  [data-theme="dark"] .arena-order-ticket {
    color: #4a2508;
  }

  @keyframes arena-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes arena-trophy-float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  @keyframes arena-orbit-one {
    0%, 100% { transform: translate(0, 0) rotate(-8deg); }
    50% { transform: translate(10px, 8px) rotate(8deg); }
  }

  @keyframes arena-orbit-two {
    0%, 100% { transform: translate(0, 0) rotate(8deg); }
    50% { transform: translate(-8px, 12px) rotate(-7deg); }
  }

  @keyframes arena-orbit-three {
    0%, 100% { transform: translate(0, 0) rotate(6deg); }
    50% { transform: translate(12px, -8px) rotate(-8deg); }
  }

  @keyframes arena-bell {
    0%, 78%, 100% { transform: rotate(0); }
    84% { transform: rotate(8deg); }
    90% { transform: rotate(-8deg); }
    96% { transform: rotate(4deg); }
  }

  @keyframes arena-ticket-pop {
    from { opacity: 0.4; transform: translateY(-12px) scale(0.91) rotate(-2deg); }
    to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }

  @keyframes arena-feedback-pop {
    0% { opacity: 0; transform: scale(0.4) translateY(8px); }
    45% { opacity: 1; transform: scale(1.18) translateY(0); }
    100% { opacity: 0; transform: scale(1) translateY(-8px); }
  }

  @keyframes arena-choice-in {
    from { opacity: 0; transform: translateY(15px) scale(0.88); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes arena-correct {
    50% { transform: scale(1.08); }
  }

  @keyframes arena-wrong {
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  @keyframes arena-conveyor {
    to { transform: translateX(67px) rotate(360deg); }
  }

  @keyframes arena-particle {
    0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(0.7); }
    100% {
      opacity: 0;
      transform: translate(var(--particle-x), var(--particle-y))
        rotate(var(--particle-r)) scale(1.25);
    }
  }

  @keyframes arena-count-pop {
    0% { opacity: 0; transform: scale(1.8); }
    30% { opacity: 1; transform: scale(0.9); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.75); }
  }

  @keyframes arena-stage-shake {
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  @keyframes arena-timer-pulse {
    to { transform: scale(1.1); text-shadow: 0 0 18px rgba(251, 113, 133, 0.7); }
  }

  @keyframes arena-lights {
    from { opacity: 0.55; transform: translateX(-3%); }
    to { opacity: 1; transform: translateX(3%); }
  }

  @keyframes arena-finish-in {
    from { opacity: 0; transform: scale(1.25); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes arena-result-crown {
    to { transform: translateY(-6px) rotate(4deg); }
  }

  /* ================================================================
     HOUSE ARENA 5 — catálogo com doze jogos, incluindo dupla online
     ================================================================ */
  .arena-game-picker-shell {
    margin: 18px 0;
    padding: 17px;
    border-radius: 20px;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(124, 58, 237, 0.055), transparent 50%),
      var(--surface);
  }

  .arena-picker-head {
    margin-bottom: 13px;
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 15px;
  }

  .arena-picker-head h3 {
    margin: 3px 0 0;
    color: var(--text);
    font-size: 18px;
    letter-spacing: -0.025em;
  }

  .arena-picker-head > span {
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
  }

  .arena-game-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(105px, 1fr));
    gap: 9px;
  }

  .arena-game-card {
    position: relative;
    min-width: 0;
    min-height: 104px;
    padding: 12px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 16px;
    color: var(--text);
    background: var(--surface-2);
    cursor: pointer;
    isolation: isolate;
    animation: arena-choice-in 0.3s both;
    animation-delay: var(--game-delay);
    transition:
      transform 0.14s ease,
      border-color 0.14s ease,
      box-shadow 0.14s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .arena-game-card::before {
    position: absolute;
    z-index: -1;
    inset: auto -25% -55% -25%;
    height: 85%;
    content: "";
    border-radius: 50%;
    opacity: 0.14;
    background: var(--game-accent);
    transition:
      opacity 0.15s,
      transform 0.15s;
  }

  .arena-game-card > span {
    filter: drop-shadow(0 6px 7px rgba(0, 0, 0, 0.12));
    font-size: 29px;
    line-height: 1;
    transition: transform 0.15s;
  }

  .arena-game-card > strong {
    min-height: 25px;
    display: grid;
    place-items: center;
    font-size: 8.5px;
    line-height: 1.25;
    text-align: center;
  }

  .arena-game-card > small {
    padding: 3px 6px;
    border-radius: 999px;
    color: var(--muted);
    background: color-mix(in srgb, var(--game-accent) 10%, var(--surface));
    font-size: 7px;
    font-weight: 900;
  }

  .arena-game-card:hover,
  .arena-game-card.active {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--game-accent) 65%, var(--line));
    box-shadow: 0 12px 25px color-mix(in srgb, var(--game-accent) 17%, transparent);
  }

  .arena-game-card:hover > span,
  .arena-game-card.active > span {
    transform: scale(1.14) rotate(-4deg);
  }

  .arena-game-card.active::after {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 15px;
    height: 15px;
    content: "✓";
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #fff;
    background: var(--game-accent);
    font-size: 8px;
    font-weight: 1000;
  }

  .arena-game-card.active::before {
    opacity: 0.25;
    transform: scale(1.18);
  }

  #arenaGameShell {
    --selected-game: #f97316;
    border-top: 3px solid var(--selected-game);
  }

  #arenaGameShell .arena-game-icon {

  #arenaGameShell .arena-game-brand span:not(.arena-game-icon) {

  #arenaGameShell .arena-how-to b {

    );

  .arena-start-btn b {

  .arena-challenge-heading {

    justify-content: space-between;

  .arena-challenge-heading span {
    padding: 5px 8px;
    border: 1px solid rgba(255, 255, 255, 0.16);

    color: #c4b5fd;
    background: rgba(255, 255, 255, 0.07);

  .arena-challenge-heading strong {

  .arena-option-grid {

    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
  }

  .arena-option {
    min-width: 0;
    min-height: 122px;
    padding: 12px 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 2px solid rgba(255, 255, 255, 0.11);
    border-radius: 18px;
    color: #fff;
    background:
      radial-gradient(
        circle at 50% 15%,
        color-mix(in srgb, var(--choice-color, #8b5cf6) 24%, transparent),
        transparent 55%
      ),
      rgba(255, 255, 255, 0.075);
    box-shadow: 0 10px 22px rgba(5, 2, 12, 0.18);
    cursor: pointer;
    animation: arena-choice-in 0.28s both;
    animation-delay: var(--choice-delay);
    transition:
      transform 0.11s,
      border-color 0.11s,
      background 0.11s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .arena-option > span {
    filter: drop-shadow(0 7px 6px rgba(0, 0, 0, 0.22));
    font-size: clamp(37px, 5vw, 52px);
    line-height: 1;
  }

  .arena-option > strong {
    min-height: 24px;
    display: grid;
    place-items: center;
    font-size: 9px;
    line-height: 1.25;
    text-align: center;

  .arena-option:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.02);
    border-color: color-mix(in srgb, var(--choice-color, #8b5cf6) 70%, #fff);
    background-color: rgba(255, 255, 255, 0.13);
  }

  .arena-option:active:not(:disabled),
  .arena-memory-choice:active:not(:disabled),
  .arena-ingredient:active:not(:disabled),
  .arena-error-cell:active:not(:disabled),
  .arena-smash-btn:active:not(:disabled) {

  }

  .arena-option.is-correct,
  .arena-error-cell.is-correct {

  .arena-option.is-wrong,
  .arena-error-cell.is-wrong {
    border-color: #fda4af;
    background: rgba(239, 68, 68, 0.3);
    animation: arena-wrong 0.28s ease-out;
  }

  .arena-option.is-answer,
  .arena-error-cell.is-answer {
    box-shadow: 0 0 0 3px rgba(134, 239, 172, 0.25);
  }

  .arena-game-surface .arena-order-ticket {
    width: min(330px, 88%);
  }

  .arena-receipt {
    width: min(355px, 92%);

    gap: 8px;
    border-radius: 7px 7px 17px 17px;

    }
    100% {
      opacity: 0;

    }

  @keyframes arena-road-flow {
    from {
