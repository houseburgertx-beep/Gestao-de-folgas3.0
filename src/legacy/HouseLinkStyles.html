<style>
  #view-house-arena {
    --hl-bg: #090716;
    --hl-bg-2: #12102a;
    --hl-card: rgba(27, 23, 58, 0.82);
    --hl-card-strong: rgba(35, 29, 75, 0.96);
    --hl-line: rgba(174, 155, 255, 0.18);
    --hl-purple: #8b5cf6;
    --hl-violet: #a855f7;
    --hl-cyan: #22d3ee;
    --hl-lime: #a3e635;
    --hl-gold: #fbbf24;
    --hl-coral: #fb7185;
    --hl-white: #f8f7ff;
    --hl-muted: #aaa4c3;
  }

  #view-house-arena .house-link-app {
    width: 100%;
    min-width: 0;
    color: var(--hl-white);
    background: var(--hl-bg);
  }

  #view-house-arena .house-link-shell {
    position: relative;
    isolation: isolate;
    min-height: min(calc(var(--arena-vh, 1vh) * 100 - 5.75rem), 58rem);
    overflow: hidden;
    padding: max(0.75rem, env(safe-area-inset-top))
      max(0.75rem, env(safe-area-inset-right))
      max(1rem, env(safe-area-inset-bottom))
      max(0.75rem, env(safe-area-inset-left));
    background:
      radial-gradient(circle at 50% -20%, rgba(139, 92, 246, 0.38), transparent 46%),
      radial-gradient(circle at 105% 40%, rgba(34, 211, 238, 0.14), transparent 38%),
      linear-gradient(160deg, var(--hl-bg-2), var(--hl-bg) 58%);
  }

  #view-house-arena .house-link-aurora {
    position: absolute;
    z-index: -2;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  #view-house-arena .house-link-aurora::before,
  #view-house-arena .house-link-aurora::after {
    position: absolute;
    width: 22rem;
    height: 22rem;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.2;
    content: "";
    animation: house-link-aurora 9s ease-in-out infinite alternate;
  }

  #view-house-arena .house-link-aurora::before {
    top: 12%;
    left: -10rem;
    background: var(--hl-violet);
  }

  #view-house-arena .house-link-aurora::after {
    right: -12rem;
    bottom: 4%;
    background: var(--hl-cyan);
    animation-delay: -4s;
  }

  #view-house-arena .house-link-topbar {
    position: relative;
    z-index: 8;
    display: grid;
    grid-template-columns: 2.75rem minmax(0, 1fr) auto;
    gap: 0.65rem;
    align-items: center;
    min-height: 3rem;
    margin-bottom: 0.75rem;
  }

  #view-house-arena .house-link-topbar > button {
    display: grid;
    width: 2.75rem;
    height: 2.75rem;
    place-items: center;
    border: 1px solid var(--hl-line);
    border-radius: 0.9rem;
    color: var(--hl-white);
    background: rgba(255, 255, 255, 0.06);
    font-size: 1.8rem;
    line-height: 1;
    backdrop-filter: blur(14px);
  }

  #view-house-arena .house-link-topbar > div {
    display: flex;
    min-width: 0;
    gap: 0.5rem;
    align-items: center;
  }

  #view-house-arena .house-link-topbar > div b {
    overflow: hidden;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #view-house-arena .house-link-live-dot {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--hl-lime);
    box-shadow: 0 0 0 0.3rem rgba(163, 230, 53, 0.12);
    animation: house-link-live 1.8s ease-out infinite;
  }

  #view-house-arena .house-link-net {
    min-width: 4.6rem;
    padding: 0.48rem 0.6rem;
    border: 1px solid rgba(163, 230, 53, 0.22);
    border-radius: 99rem;
    color: var(--hl-lime);
    background: rgba(163, 230, 53, 0.08);
    font-size: 0.6rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-align: center;
  }

  #view-house-arena .house-link-net.is-offline {
    border-color: rgba(251, 113, 133, 0.28);
    color: var(--hl-coral);
    background: rgba(251, 113, 133, 0.1);
  }

  #view-house-arena .house-link-primary,
  #view-house-arena .house-link-secondary,
  #view-house-arena .house-link-danger,
  #view-house-arena .house-link-text-btn {
    min-height: 3rem;
    border-radius: 1rem;
    font: inherit;
    font-weight: 900;
  }

  #view-house-arena .house-link-primary {
    border: 0;
    color: #100b24;
    background: linear-gradient(135deg, var(--hl-cyan), #9ff4ff);
    box-shadow: 0 0.75rem 2rem rgba(34, 211, 238, 0.2);
  }

  #view-house-arena .house-link-primary:disabled {
    color: var(--hl-muted);
    background: rgba(255, 255, 255, 0.09);
    box-shadow: none;
    opacity: 0.72;
  }

  #view-house-arena .house-link-primary.is-ready {
    color: #172008;
    background: linear-gradient(135deg, var(--hl-lime), #d9f99d);
    box-shadow: 0 0.75rem 2rem rgba(163, 230, 53, 0.16);
  }

  #view-house-arena .house-link-secondary {
    border: 1px solid var(--hl-line);
    color: var(--hl-white);
    background: rgba(255, 255, 255, 0.06);
  }

  #view-house-arena .house-link-danger {
    border: 0;
    color: #fff;
    background: linear-gradient(135deg, #e11d48, var(--hl-coral));
  }

  #view-house-arena .house-link-text-btn {
    border: 0;
    color: var(--hl-muted);
    background: transparent;
  }

  #view-house-arena .house-link-overline {
    color: var(--hl-cyan);
    font-size: 0.64rem;
    font-weight: 900;
    letter-spacing: 0.16em;
  }

  /* Entrada */
  #view-house-arena .house-link-landing {
    display: flex;
    flex-direction: column;
  }

  #view-house-arena .house-link-launch-hero {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 40rem;
    margin: 0 auto;
    padding: clamp(0.5rem, 4vw, 2.5rem) 0.25rem 1.4rem;
    text-align: center;
  }

  #view-house-arena .house-link-logo-orbit {
    position: relative;
    display: grid;
    width: clamp(7.5rem, 32vw, 10rem);
    height: clamp(7.5rem, 32vw, 10rem);
    margin-bottom: 1.25rem;
    place-items: center;
    border: 1px solid rgba(168, 85, 247, 0.35);
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(139, 92, 246, 0.38), transparent 60%),
      rgba(255, 255, 255, 0.02);
    box-shadow:
      inset 0 0 2rem rgba(139, 92, 246, 0.2),
      0 0 4rem rgba(139, 92, 246, 0.24);
  }

  #view-house-arena .house-link-logo-orbit::before,
  #view-house-arena .house-link-logo-orbit::after,
  #view-house-arena .house-link-logo-orbit i {
    position: absolute;
    inset: 0.55rem;
    border: 1px dashed rgba(34, 211, 238, 0.36);
    border-radius: 50%;
    content: "";
    animation: house-link-spin 9s linear infinite;
  }

  #view-house-arena .house-link-logo-orbit::after {
    inset: 1.25rem;
    border-style: solid;
    border-color: transparent rgba(168, 85, 247, 0.65);
    animation-direction: reverse;
    animation-duration: 5s;
  }

  #view-house-arena .house-link-logo-orbit i {
    inset: -0.35rem;
    border-color: rgba(163, 230, 53, 0.25) transparent;
    animation-duration: 13s;
  }

  #view-house-arena .house-link-logo-orbit > span {
    position: relative;
    z-index: 2;
    font-size: clamp(2.8rem, 12vw, 4.2rem);
    filter: drop-shadow(0 0 1rem rgba(34, 211, 238, 0.38));
  }

  #view-house-arena .house-link-logo-orbit > b {
    position: absolute;
    top: 0.35rem;
    right: -0.25rem;
    z-index: 3;
    padding: 0.35rem 0.5rem;
    border-radius: 99rem;
    color: #142004;
    background: var(--hl-lime);
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    box-shadow: 0 0 1rem rgba(163, 230, 53, 0.45);
  }

  #view-house-arena .house-link-launch-hero h2 {
    margin: 0.35rem 0 0.6rem;
    font-size: clamp(2.1rem, 9vw, 4.1rem);
    line-height: 0.95;
    letter-spacing: -0.06em;
  }

  #view-house-arena .house-link-launch-hero h2 em {
    display: block;
    color: transparent;
    background: linear-gradient(90deg, var(--hl-cyan), #c084fc);
    -webkit-background-clip: text;
    background-clip: text;
    font-style: normal;
  }

  #view-house-arena .house-link-launch-hero p {
    max-width: 34rem;
    margin: 0;
    color: var(--hl-muted);
    font-size: clamp(0.9rem, 3.5vw, 1.08rem);
    line-height: 1.55;
  }

  #view-house-arena .house-link-feature-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    justify-content: center;
    margin-top: 1.05rem;
  }

  #view-house-arena .house-link-feature-row span {
    padding: 0.45rem 0.65rem;
    border: 1px solid var(--hl-line);
    border-radius: 99rem;
    color: #dcd7ee;
    background: rgba(255, 255, 255, 0.045);
    font-size: 0.68rem;
    font-weight: 800;
  }

  #view-house-arena .house-link-entry-grid {
    display: grid;
    width: min(100%, 42rem);
    gap: 0.75rem;
    margin: 0 auto;
  }

  #view-house-arena .house-link-create {
    display: grid;
    grid-template-columns: 2.6rem minmax(0, 1fr) auto;
    align-items: center;
    min-height: 4.4rem;
    padding: 0.8rem 1rem;
    text-align: left;
  }

  #view-house-arena .house-link-create > span {
    font-size: 1.75rem;
    font-weight: 500;
  }

  #view-house-arena .house-link-create > div {
    display: flex;
    min-width: 0;
    flex-direction: column;
  }

  #view-house-arena .house-link-create strong {
    font-size: 1rem;
  }

  #view-house-arena .house-link-create small {
    margin-top: 0.15rem;
    font-size: 0.68rem;
    font-weight: 700;
    opacity: 0.68;
  }

  #view-house-arena .house-link-create > b {
    font-size: 1.6rem;
  }

  #view-house-arena .house-link-join {
    padding: 0.8rem;
    border: 1px solid var(--hl-line);
    border-radius: 1.15rem;
    background: rgba(255, 255, 255, 0.045);
    backdrop-filter: blur(18px);
  }

  #view-house-arena .house-link-join label {
    display: block;
    margin: 0 0 0.5rem 0.15rem;
    color: var(--hl-muted);
    font-size: 0.6rem;
    font-weight: 900;
    letter-spacing: 0.12em;
  }

  #view-house-arena .house-link-join > div {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.55rem;
  }

  #view-house-arena .house-link-join input {
    width: 100%;
    min-width: 0;
    height: 3.25rem;
    padding: 0 0.9rem;
    border: 1px solid rgba(34, 211, 238, 0.26);
    border-radius: 0.85rem;
    outline: 0;
    color: var(--hl-white);
    background: rgba(9, 7, 22, 0.72);
    font-family: inherit;
    font-size: 1.18rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  #view-house-arena .house-link-join input:focus {
    border-color: var(--hl-cyan);
    box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.12);
  }

  #view-house-arena .house-link-join button {
    min-width: 5.4rem;
    min-height: 3.25rem;
    border: 0;
    border-radius: 0.85rem;
    color: var(--hl-white);
    background: linear-gradient(135deg, var(--hl-purple), var(--hl-violet));
    font-weight: 900;
  }

  #view-house-arena .house-link-tech-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem 0.8rem;
    justify-content: center;
    margin-top: 0.85rem;
    color: #77718f;
    font-size: 0.6rem;
    font-weight: 800;
  }

  #view-house-arena .house-link-tech-strip span {
    display: flex;
    gap: 0.3rem;
    align-items: center;
  }

  #view-house-arena .house-link-tech-strip i {
    width: 0.35rem;
    height: 0.35rem;
    border-radius: 50%;
    background: var(--hl-lime);
  }

  /* Loading */
  #view-house-arena .house-link-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  #view-house-arena .house-link-loader {
    position: relative;
    display: grid;
    width: 7rem;
    height: 7rem;
    margin-bottom: 1rem;
    place-items: center;
  }

  #view-house-arena .house-link-loader i {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: var(--hl-cyan);
    border-radius: 50%;
    animation: house-link-spin 1.2s linear infinite;
  }

  #view-house-arena .house-link-loader i:nth-child(2) {
    inset: 0.7rem;
    border-top-color: var(--hl-violet);
    animation-direction: reverse;
    animation-duration: 1.6s;
  }

  #view-house-arena .house-link-loader i:nth-child(3) {
    inset: 1.4rem;
    border-top-color: var(--hl-lime);
    animation-duration: 2s;
  }

  #view-house-arena .house-link-loader span {
    font-size: 2rem;
  }

  #view-house-arena .house-link-loading > strong {
    font-size: 1.15rem;
  }

  #view-house-arena .house-link-loading > small {
    margin-top: 0.35rem;
    color: var(--hl-muted);
  }

  /* Sala */
  #view-house-arena .house-link-room-code {
    max-width: 38rem;
    margin: 0 auto;
    padding: 1rem;
    border: 1px solid rgba(34, 211, 238, 0.2);
    border-radius: 1.2rem;
    background:
      linear-gradient(135deg, rgba(34, 211, 238, 0.07), rgba(139, 92, 246, 0.08)),
      rgba(255, 255, 255, 0.035);
    text-align: center;
    backdrop-filter: blur(18px);
  }

  #view-house-arena .house-link-room-code > span {
    color: var(--hl-cyan);
    font-size: 0.62rem;
    font-weight: 900;
    letter-spacing: 0.15em;
  }

  #view-house-arena .house-link-room-code > strong {
    display: block;
    margin: 0.35rem 0;
    color: var(--hl-white);
    font-size: clamp(2.2rem, 13vw, 4.5rem);
    line-height: 1;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    text-shadow: 0 0 2rem rgba(34, 211, 238, 0.3);
  }

  #view-house-arena .house-link-room-code p {
    max-width: 27rem;
    margin: 0 auto 0.75rem;
    color: var(--hl-muted);
    font-size: 0.75rem;
  }

  #view-house-arena .house-link-room-code > div {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
  }

  #view-house-arena .house-link-room-code button {
    min-height: 2.75rem;
    padding: 0 0.85rem;
    border: 1px solid var(--hl-line);
    border-radius: 0.8rem;
    color: var(--hl-white);
    background: rgba(255, 255, 255, 0.06);
    font-weight: 800;
  }

  #view-house-arena .house-link-pairing {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.5rem minmax(0, 1fr);
    gap: 0.5rem;
    align-items: center;
    max-width: 46rem;
    margin: 1rem auto;
  }

  #view-house-arena .house-link-player-card {
    display: flex;
    min-width: 0;
    min-height: 11.25rem;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 0.45rem;
    border: 1px solid var(--hl-line);
    border-radius: 1.2rem;
    background: var(--hl-card);
    text-align: center;
    backdrop-filter: blur(18px);
  }

  #view-house-arena .house-link-player-card.is-me {
    border-color: rgba(34, 211, 238, 0.3);
  }

  #view-house-arena .house-link-player-card.is-empty {
    border-style: dashed;
    opacity: 0.68;
  }

  #view-house-arena .house-link-avatar {
    position: relative;
    display: grid;
    width: 3.8rem;
    height: 3.8rem;
    margin-bottom: 0.45rem;
    place-items: center;
    border: 1px solid rgba(168, 85, 247, 0.45);
    border-radius: 1.2rem;
    background: linear-gradient(145deg, rgba(139, 92, 246, 0.36), rgba(34, 211, 238, 0.16));
    font-size: 1.1rem;
    font-weight: 950;
  }

  #view-house-arena .house-link-avatar i {
    position: absolute;
    right: -0.15rem;
    bottom: -0.15rem;
    width: 0.85rem;
    height: 0.85rem;
    border: 0.18rem solid var(--hl-bg-2);
    border-radius: 50%;
    background: #6b7280;
  }

  #view-house-arena .house-link-avatar.is-online i {
    background: var(--hl-lime);
    box-shadow: 0 0 0.7rem rgba(163, 230, 53, 0.55);
  }

  #view-house-arena .house-link-player-card > small {
    color: var(--hl-cyan);
    font-size: 0.55rem;
    font-weight: 900;
    letter-spacing: 0.12em;
  }

  #view-house-arena .house-link-player-card > strong {
    overflow: hidden;
    max-width: 100%;
    margin-top: 0.2rem;
    font-size: 0.9rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #view-house-arena .house-link-player-card > em {
    overflow: hidden;
    max-width: 100%;
    margin-top: 0.1rem;
    color: var(--hl-muted);
    font-size: 0.65rem;
    font-style: normal;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #view-house-arena .house-link-player-card > b {
    margin-top: 0.55rem;
    padding: 0.3rem 0.45rem;
    border-radius: 99rem;
    color: #8f89a7;
    background: rgba(255, 255, 255, 0.055);
    font-size: 0.52rem;
    letter-spacing: 0.08em;
  }

  #view-house-arena .house-link-player-card > b.is-ready {
    color: var(--hl-lime);
    background: rgba(163, 230, 53, 0.1);
  }

  #view-house-arena .house-link-pair-beam {
    display: flex;
    align-items: center;
  }

  #view-house-arena .house-link-pair-beam i {
    flex: 1;
    height: 1px;
    background: var(--hl-line);
  }

  #view-house-arena .house-link-pair-beam span {
    display: grid;
    width: 2.1rem;
    height: 2.1rem;
    place-items: center;
    border: 1px solid var(--hl-line);
    border-radius: 50%;
    background: var(--hl-bg-2);
  }

  #view-house-arena .house-link-pair-beam.is-linked i {
    background: linear-gradient(90deg, var(--hl-purple), var(--hl-cyan));
    box-shadow: 0 0 0.7rem rgba(34, 211, 238, 0.4);
  }

  #view-house-arena .house-link-pair-beam.is-linked span {
    border-color: var(--hl-cyan);
    animation: house-link-live 1.5s ease-out infinite;
  }

  #view-house-arena .house-link-ready-panel {
    display: grid;
    max-width: 38rem;
    gap: 0.8rem;
    margin: 0 auto;
    padding: 1rem;
    border: 1px solid var(--hl-line);
    border-radius: 1.15rem;
    background: rgba(255, 255, 255, 0.035);
  }

  #view-house-arena .house-link-ready-panel > div {
    display: flex;
    flex-direction: column;
  }

  #view-house-arena .house-link-ready-panel > div > strong {
    margin-top: 0.2rem;
    font-size: 0.95rem;
  }

  #view-house-arena .house-link-ready-panel > div > small {
    margin-top: 0.15rem;
    color: var(--hl-muted);
    font-size: 0.7rem;
  }

  #view-house-arena .house-link-wait-pulse {
    flex-direction: row !important;
    gap: 0.55rem;
    align-items: center;
    justify-content: center;
    min-height: 3rem;
    color: var(--hl-muted);
    font-size: 0.75rem;
    font-weight: 800;
  }

  #view-house-arena .house-link-wait-pulse i {
    width: 0.65rem;
    height: 0.65rem;
    border-radius: 50%;
    background: var(--hl-cyan);
    animation: house-link-live 1.5s ease-out infinite;
  }

  /* HUD e missão */
  #view-house-arena .house-link-game {
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }

  #view-house-arena .house-link-game-hud {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.45rem;
  }

  #view-house-arena .house-link-game-hud > div {
    display: flex;
    min-width: 0;
    min-height: 3.7rem;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hl-line);
    border-radius: 0.9rem;
    background: rgba(255, 255, 255, 0.045);
    backdrop-filter: blur(15px);
  }

  #view-house-arena .house-link-game-hud small {
    color: var(--hl-muted);
    font-size: clamp(0.45rem, 2.2vw, 0.58rem);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-align: center;
  }

  #view-house-arena .house-link-game-hud strong {
    margin-top: 0.1rem;
    font-size: clamp(1rem, 4.8vw, 1.45rem);
  }

  #view-house-arena .house-link-hud-time {
    border-color: rgba(34, 211, 238, 0.3) !important;
