  function monthlyLeaveRewardStorageKey_(reward) {

      encodeURIComponent(String(reward?.employeeId || "")) +
      ":" +
      String(reward?.month || "")
    );
  }

  function monthlyLeaveRewardSeen_(reward) {
    if (!reward?.credited || reward.acknowledged) return true;
    try {
      return localStorage.getItem(monthlyLeaveRewardStorageKey_(reward)) === "1";
    } catch {
      return false;
    }
  }

  function rememberMonthlyLeaveReward_(reward) {
    try {
      localStorage.setItem(monthlyLeaveRewardStorageKey_(reward), "1");
    } catch {
      // O comprovante no Firebase continua sendo a fonte principal de leitura.
    }
  }

  function closeMonthlyLeaveReward_() {
    const overlay = document.querySelector(".monthly-leave-reward-overlay");

  async function acknowledgeMonthlyLeaveReward_(goToBalance) {
    const reward = state.bootstrap?.monthlyLeaveReward;
    const overlay = document.querySelector(".monthly-leave-reward-overlay");
    if (!reward || !overlay || overlay.dataset.pending === "1") return;
    overlay.dataset.pending = "1";

      .querySelectorAll("button")
      .forEach((button) => (button.disabled = true));
    overlay.querySelector(".monthly-leave-reward-primary")?.classList.add(
      "is-loading",

      await call(FN.acknowledgeMonthlyLeaveReward, { month: reward.month });
      reward.acknowledged = true;
      rememberMonthlyLeaveReward_(reward);
      closeMonthlyLeaveReward_();
      if (goToBalance) {

        window.setTimeout(() => {
          document
            .querySelector('[data-metric="saldoFolgas"]')

        .querySelectorAll("button")

      overlay.querySelector(".monthly-leave-reward-primary")?.classList.remove(
        "is-loading",
      );
      toast(error?.message || "Não foi possível confirmar o aviso.", true);
    }
  }

        <button type="button" class="btn btn-ghost monthly-leave-reward-later">Agora não</button>

    overlay.querySelector(".monthly-leave-reward-primary").onclick = () =>

  function isSessionError_(message) {
    const text = String(message || "").toLowerCase();
    return (
      text.includes("sessão") ||
      text.includes("session") ||
      text.includes("expirou") ||
      text.includes("token") ||
      text.includes("entre novamente")
    );
  }

  function installStartupSafety_() {
    window.addEventListener("error", (event) => {
      console.error("Erro global:", event.error || event.message);
      setLoading(false);
    });
    window.addEventListener("unhandledrejection", (event) => {
      console.error("Promessa rejeitada:", event.reason);
      setLoading(false);
    });
    setTimeout(() => {
      const overlay = $("#loadingOverlay");
      if (overlay && !overlay.classList.contains("hidden")) {
        console.warn("Tempo limite de inicialização atingido.");
        setLoading(false);
        showLogin();
        loginError("O sistema demorou para responder. Faça login novamente.");
      }
    }, 35000);

  function portalApiError_() {
    const error = new Error(
      "O portal não terminou de carregar. Verifique sua conexão e atualize a página.",
    );
    error.code = "PORTAL_API_NOT_READY";
    return error;
  }

  async function waitForPortalApi_() {
    if (window.google?.script?.run) return;
    const ready = window.__GESTAO_API_READY__;
    if (!ready || typeof ready.then !== "function") throw portalApiError_();
    let timeout;
    try {
      await Promise.race([
        ready,
        new Promise((_, reject) => {
          timeout = window.setTimeout(
            () => reject(portalApiError_()),
            10000,
          );
        }),
      ]);
    } catch (error) {
      throw error?.code === "PORTAL_API_NOT_READY"
        ? error
        : portalApiError_();
    } finally {
      window.clearTimeout(timeout);
    }
    if (!window.google?.script?.run) throw portalApiError_();
  }

  async function gas(name, ...args) {
    await waitForPortalApi_();
    return new Promise((resolve, reject) => {
      const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((e) =>
            reject(new Error(e?.message || String(e))),
          ),
        token = typeof sessionToken === "function" ? sessionToken() : "";
      if (
        token &&
        name !== "loginUser" &&
        name !== "requestPasswordReset" &&
        name !== "confirmPasswordReset" &&
        name !== "apiCallWithSession"
      )
        runner.apiCallWithSession(token, name, args);
      else runner[name](...args);
    });
  }
  function normalizeResponse(r) {
    if (r && typeof r === "object" && "success" in r) return r;
    return { success: true, message: "", data: r };
  }
  const pendingCalls = new Map();
  function callKey(name, args) {
    try {
      return name + "|" + JSON.stringify(args);
    } catch (e) {
      return name + "|" + String(args);
    }
  }
  async function call(name, ...args) {
    const key = callKey(name, args);
    if (pendingCalls.has(key)) return pendingCalls.get(key);
    const operation = (async () => {
      const r = normalizeResponse(await gas(name, ...args));
      if (!r.success)
        throw new Error(
          r.message || r.details || "A operação não foi concluída.",
        );
      return r.data;
    })();
    pendingCalls.set(key, operation);
    try {
      return await operation;
    } finally {
      if (pendingCalls.get(key) === operation) pendingCalls.delete(key);
    }
  }
  const arr = (v) => (Array.isArray(v) ? v : []);
  const val = (o, ...keys) => {
    for (const k of keys)
      if (o && o[k] !== undefined && o[k] !== null) return o[k];
    return "";
  };
  const bool = (v) =>
    v === true ||
    String(v).toLowerCase() === "true" ||
    String(v) === "1" ||
    String(v).toLowerCase() === "sim";
  const esc = (v) =>
    String(v ?? "").replace(
      /[&<>'"]/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;",
        })[c],
    );
  const iso = (d) => {
    if (!d) return "";
    if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}/.test(d))
      return d.slice(0, 10);
    const x = new Date(d);
    return isNaN(x)
      ? ""
      : `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  };
  const timeInput = (value) => {
    if (value === null || value === undefined || value === "") return "";
    const text = String(value).trim();
    const direct = text.match(/^(\d{1,2}):(\d{2})/);
    if (direct) {
      const hour = Number(direct[1]),
        minute = Number(direct[2]);
      if (hour <= 23 && minute <= 59)
        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }
    const embedded = text.match(/[T\s](\d{2}):(\d{2})(?::\d{2})?/);
    if (embedded) return `${embedded[1]}:${embedded[2]}`;
    const parsed = new Date(value);
    if (!Number.isNaN(parsed.getTime())) {
      return `${String(parsed.getHours()).padStart(2, "0")}:${String(parsed.getMinutes()).padStart(2, "0")}`;
    }
    return "";
  };
  const dateBR = (d) => {
    const s = iso(d);
    return s ? s.split("-").reverse().join("/") : "—";
  };
  const formatDateUI = dateBR;
  const idOf = (o, type) => val(o, type + "ID", type + "Id", "id");
  function upsertState(listName, record, type) {
    if (!record) return;
    const list = arr(state[listName]),
      id = String(idOf(record, type));
    const index = list.findIndex((item) => String(idOf(item, type)) === id);
    if (index >= 0) list[index] = Object.assign({}, list[index], record);
    else list.push(record);
    state[listName] = list;
  }
  const profile = (u) => val(u, "perfil", "Perfil", "profile");
  /*
   * Normaliza os textos de status usados na planilha para classes internas.
   * Isso evita depender de acentos, letras maiúsculas ou pequenas variações.
   */
  const statusClass = (s) => {
    s = String(s || "")
      .trim()
      .toLowerCase();
    return s.includes("aprov")
      ? "approved"
      : s.includes("pendent")
        ? "pending"
        : s.includes("conclu")
          ? "completed"
          : s.includes("rejeit")
            ? "rejected"
            : s.includes("cancel")
              ? "cancelled"
              : s.includes("ativ")
                ? "active"
                : "inactive";
  };

  /*
   * No calendário só entram registros que ainda representam uma folga válida.
   * Canceladas e rejeitadas permanecem no histórico, porém não aparecem como
   * eventos ativos no calendário principal nem no mini calendário.
   */
  const CALENDAR_VISIBLE_STATUSES = new Set([
    "pending",
    "approved",
    "completed",
  ]);
  const timeOffStatus = (record) =>
    statusClass(val(record, "Status", "status"));
  const isTimeOffVisibleOnCalendar = (record) =>
    CALENDAR_VISIBLE_STATUSES.has(timeOffStatus(record));

  /* Verifica se uma folga cobre uma data específica, inclusive em períodos. */
  function timeOffCoversDate(record, dateKey) {
    if (!isTimeOffVisibleOnCalendar(record)) return false;
    const from = iso(val(record, "DataInicio", "dataInicio"));
    const to = iso(val(record, "DataFim", "dataFim") || from);
    return Boolean(from && dateKey >= from && dateKey <= to);
  }

  const badge = (s) =>

  const initials = (n) =>

      .split(/\s+/)
      .slice(0, 2)
      .map((x) => x[0])
      .join("")
      .toUpperCase();
  function toast(message, error = false) {
    const el = document.createElement("div");
    el.className = "toast" + (error ? " error" : "");
    const icon = document.createElement("span");
    icon.className = "toast-icon";
    icon.textContent = error ? "!" : "✓";
    const copy = document.createElement("div");
    copy.className = "toast-copy";
    const title = document.createElement("strong");
    title.textContent = error ? "Não foi possível concluir" : "Tudo certo";
    const text = document.createElement("span");
    text.textContent = message;
    copy.append(title, text);
    const close = document.createElement("button");
    close.type = "button";
    close.className = "toast-close";
    close.textContent = "×";
    close.onclick = () => el.remove();
    el.append(icon, copy, close);
    $("#toastContainer").append(el);
    setTimeout(() => {
      el.classList.add("toast-out");
      setTimeout(() => el.remove(), 220);
    }, 3800);
  }

  async function submitLogin(e) {
    e.preventDefault();
    document.activeElement?.blur();
    window.scrollTo(0, 0);
    const emailInput = $("#loginEmail"),
      passwordInput = $("#loginPassword"),
      rememberInput = $("#rememberLogin");
    if (!emailInput || !passwordInput || !rememberInput) {
      loginError(
        "A tela de login não foi carregada corretamente. Atualize a página.",
      );
      return;
    }
    setLoading(true);
    try {
      const remember = rememberInput.checked,
        result = await call(FN.login, {
          email: emailInput.value.trim(),
          senha: passwordInput.value,
          password: passwordInput.value,
          remember,
        });
      if (!result)
        throw new Error("O servidor não devolveu os dados do login.");
      const token = val(result, "token", "sessionToken");
      if (token)
        storeSessionToken_(
          token,
          remember && result.rememberPersisted !== false,
          Number(result.rememberExpiresAt || 0),
        );
      if (result.bootstrap) applyBootstrapData(result.bootstrap);
      else await loadApplication(false, false, token);
      if (remember && result.rememberPersisted === false)
        toast(
          "Login realizado, mas o servidor não conseguiu manter esta sessão por 7 dias.",
          true,
        );
      else toast("Login realizado com sucesso.");
    } catch (err) {
      console.error("Falha no login:", err);
      const message = String(err?.message || err || "Não foi possível entrar.");
      loginError(
        message.includes("not a function")
          ? "O login por senha ainda não está instalado no backend. Adicione loginUser() em Users.gs."
          : message,
      );
    } finally {
      setLoading(false);
      releaseFormSubmission_($("#loginForm"));
    }
  }
  async function logoutApplication() {
    const token = sessionToken();
    try {
      if (token) await call(FN.logout, token);
    } catch (e) {
      console.warn("Logout:", e.message);
    } finally {
      clearStoredSession_();
      state.bootstrap = null;
      state.user = null;
      state.timeClock = null;
      state.coreReady = false;
      state.coreLoading = false;
      state.shellCached = false;

        resetHouseArenaState_();
      CORE_BOOTSTRAP_PROMISE_ = null;
      USERS_LOAD_PROMISE_ = null;
      document.body.classList.remove("app-core-loading");
      $("#app").classList.add("hidden");
      showLogin();
      toast("Sessão encerrada.");
    }
  }
  async function requestPasswordReset() {
    const resetActive = !$("#resetPasswordForm").classList.contains("hidden");
    const email = (
      resetActive ? $("#resetPasswordEmail").value : $("#loginEmail").value
    ).trim();
    if (!email) {
      const message = "Informe o seu e-mail primeiro.";
      return resetActive ? resetPasswordError_(message) : loginError(message);
    }
    setLoading(true);
    try {
      await call(FN.resetPassword, { email });
      showLoginForm_();
      toast(
        "Enviamos um link seguro para redefinir a senha. Confira também a pasta de spam.",
      );
    } catch (err) {
      if (resetActive) resetPasswordError_(err.message);
      else loginError(err.message);
    } finally {
      setLoading(false);
    }
  }
  async function confirmPasswordResetUI_(event) {
    event.preventDefault();
    const email = $("#resetPasswordEmail").value.trim(),
      code = $("#resetPasswordCode").value.trim(),
      password = $("#resetPasswordNew").value,
      confirmation = $("#resetPasswordConfirm").value;
    resetPasswordError_("");
    if (password !== confirmation) {
      resetPasswordError_("A confirmação da nova senha não confere.");
      releaseFormSubmission_(event.currentTarget);
      return;
    }
    setLoading(true);
    try {
      await call(FN.confirmPasswordReset, {
        email,
        code,
        password,
        passwordConfirmation: confirmation,
      });
      clearStoredSession_();
      $("#loginEmail").value = email;
      $("#loginPassword").value = "";
      $("#resetPasswordForm").reset();
      showLoginForm_();
      toast("Senha redefinida. Entre com a nova senha.");
    } catch (error) {
      resetPasswordError_(error.message);
    } finally {
      setLoading(false);
      releaseFormSubmission_(event.currentTarget);
    }
  }

  async function saveOwnProfile(event) {
    event.preventDefault();
    const email = $("#profileEmail").value.trim().toLowerCase(),
      currentPassword = $("#profileCurrentPassword").value,
      newPassword = $("#profileNewPassword").value,
      confirmation = $("#profileConfirmPassword").value,
      emailChanged =
        email !== String(val(state.user, "email", "Email")).toLowerCase();
    if (emailChanged && newPassword)
      return toast(
        "Altere primeiro o e-mail ou a senha; faça uma alteração por vez.",
        true,
      );
    if (newPassword && newPassword.length < 10)
      return toast("A nova senha deve ter pelo menos 10 caracteres.", true);
    if (newPassword !== confirmation)
      return toast("A confirmação da nova senha não confere.", true);
    if ((emailChanged || newPassword) && !currentPassword)
      return toast(
        "Informe a senha atual para alterar o e-mail ou a senha.",
        true,
      );
    const payload = {
      Email: email,
      SenhaAtual: currentPassword,
      NovaSenha: newPassword,
      ConfirmarNovaSenha: confirmation,
    };
    setLoading(true);
    try {
      const saved = await call(FN.updateProfile, payload);
      state.user = Object.assign({}, state.user, saved);
      if (state.bootstrap) state.bootstrap.user = state.user;
      const employeeId = val(state.user, "funcionarioId", "FuncionarioID");
      const employee = state.employees.find(
        (item) => String(idOf(item, "Funcionario")) === String(employeeId),
      );
      if (employee) employee.Email = email;
      hydrateUser();
      closeDialog("profileDialog");
      if (emailChanged || newPassword) {
        $("#loginEmail").value = email;
        await logoutApplication();
        toast(
          "Dados de acesso atualizados. Entre novamente para sua segurança.",
        );
        return;
      }
      toast("Perfil atualizado.");
    } catch (error) {
      toast(error.message, true);
    } finally {
      setLoading(false);
    }
  }
  async function loadApplication(
    silent = false,
    googleLogin = false,
    token = "",
    forceRefresh = false,
  ) {
    if (!silent) setLoading(true);
    try {
      const currentToken =
        token || sessionToken();
      if (!currentToken) {
        if (!silent) showLogin();
        return;
      }
      /*
       * Mostra a última fotografia validada imediatamente, tanto no celular
       * quanto no computador. A sessão continua sendo confirmada pelo servidor
       * logo depois; este cache só elimina a espera visual da abertura.
       */
      if (!silent && restoreTurboShellCache_()) setLoading(false);
      const request = {
        sessionToken: currentToken,
        forceRefresh: Boolean(forceRefresh),
        fast: !forceRefresh,
        includeUsers: false,
      };
      const timeout = new Promise((_, reject) =>
        setTimeout(
          () =>
            reject(new Error("O carregamento demorou mais que o esperado.")),
          30000,
        ),
      );
      const data = await Promise.race([
        call(FN.sessionBootstrap, request),
        timeout,
      ]);
      applyBootstrapData(data);
      if (silent) toast("Dados atualizados.");
    } catch (error) {
      console.error("Erro ao carregar aplicação:", error);
      const message = error?.message || "Não foi possível carregar o sistema.";
      const sessionInvalid = isSessionError_(message);
      if (sessionInvalid) clearStoredSession_();
      if (googleLogin) loginError(message);
      else if (!silent) {
        if (!sessionInvalid && state.shellCached && state.user) {
          hideLogin();
          $("#app").classList.remove("hidden");
          toast(
            "Você continua conectado. A sincronização será retomada automaticamente.",
            true,
          );
        } else {
          showLogin();
          loginError(message);
        }
      } else toast(message, true);
    } finally {
      setLoading(false);
    }
  }
  async function refreshApplication() {

  function applyBootstrapData(data) {
    data = data || {};
    const deferred = bool(data.deferred);
    const hasServerSnapshot = bool(data.snapshot);
    const incomingIdentity = turboUserIdentity_(data.user),
      currentIdentity = turboUserIdentity_(state.user);
    if (
      incomingIdentity &&
      currentIdentity &&
      incomingIdentity !== currentIdentity
    ) {
      /* Nunca reutilizar o estado operacional entre duas contas. */
      state.stores = [];
      state.employees = [];
      state.timeOff = [];
      state.holidays = [];
      state.users = [];
      state.dashboard = {};
      state.timeClock = null;
      state.hourBalance = null;
      state.notifications = [];
      state.swaps = [];
      if (typeof resetHouseArenaState_ === "function")
        resetHouseArenaState_();
      state.shellCached = false;
      state.secondaryStarted = false;
      localStorage.removeItem(TURBO_CACHE_KEY_);
      localStorage.removeItem("gf-turbo-shell-v2");
    }
    state.bootstrap = data;
    state.user = data.user || state.user || {};
    state.permissions = arr(data.permissions);
    /* O bootstrap rápido pode vir sem coleções. Nesse caso, preservar o
       estado local evita que o dashboard pisque e volte a ficar vazio. */
    if (!deferred || hasServerSnapshot || arr(data.stores).length)
      state.stores = arr(data.stores);
    if (!deferred || hasServerSnapshot || arr(data.employees).length)
      state.employees = arr(data.employees);
    if (
      !deferred ||
      hasServerSnapshot ||
      arr(data.timeOff || data.timeOffRecords).length
    )
      state.timeOff = arr(data.timeOff || data.timeOffRecords);
    if (!deferred || arr(data.holidays).length)
      state.holidays = arr(data.holidays);
    state.pendingCenter.loaded = false;
    if (!bool(data.usersDeferred)) state.users = arr(data.users);
    if (!deferred || Object.keys(data.dashboard || {}).length)
      state.dashboard = data.dashboard || {};
    state.coreReady = !deferred;
    state.coreLoading = deferred;
    state.shellCached = state.shellCached || bool(data.snapshot);
    state.usersLoaded = isAdmin() && !bool(data.usersDeferred);
    state.usersLoading = false;
    hydrateUser();
    if (state.coreReady) populateAllSelects();
    renderInitialView();
    if (state.coreReady && state.currentView !== "dashboard")
      renderCurrentView(state.currentView);
    hideLogin();
    $("#app").classList.remove("hidden");
    $("#unauthorized").classList.add("hidden");
    scheduleMonthlyLeaveReward_();
    document.body.classList.toggle("app-core-loading", deferred);
    saveTurboShellCache_();
    console.info("[performance] interface pronta", {
      elapsedMs: Date.now() - APP_BOOT_STARTED_AT_,
      serverMs: Number(data.performance?.serverMs || 0),
      mode: data.performance?.mode || (deferred ? "fast" : "full"),
    });
    if (deferred) scheduleDeferredBootstrap_();
    else scheduleSecondaryLoads_();
  }

  function scheduleDeferredBootstrap_() {
    const startCore = () => ensureCoreData_().catch(() => {});
    const start = () => {
      if (isEmployee()) {
        /* O ponto recebe uma pequena vantagem para aquecer os caches, mas uma
           rede lenta não segura mais as folgas e o restante da tela por até
           quatro segundos. As duas cargas podem continuar em paralelo. */
        loadTimeClockQuick_();
        setTimeout(startCore, isMobileClient_() ? 1100 : 650);
      } else {
        setTimeout(startCore, isMobileClient_() ? 140 : 40);
      }
    };
    if (typeof requestAnimationFrame === "function")
      requestAnimationFrame(() => requestAnimationFrame(start));
    else start();
  }

  async function ensureCoreData_() {
    if (state.coreReady) return state.bootstrap;
    if (CORE_BOOTSTRAP_PROMISE_) return CORE_BOOTSTRAP_PROMISE_;
    state.coreLoading = true;
    document.body.classList.add("app-core-loading");
    const startedAt = Date.now();
    CORE_BOOTSTRAP_PROMISE_ = call(FN.sessionBootstrap, {
      sessionToken: sessionToken(),
      forceRefresh: false,
      fast: false,
      includeUsers: false,
    })
      .then((data) => {
        mergeDeferredBootstrap_(data || {});
        console.info("[performance] dados principais sincronizados", {
          elapsedMs: Date.now() - startedAt,
          totalMs: Date.now() - APP_BOOT_STARTED_AT_,
          serverMs: Number(data?.performance?.serverMs || 0),
        });
        return data;
      })
      .catch((error) => {
        console.error("Falha na sincronização dos dados:", error);
        toast(
          "A interface abriu, mas os dados não terminaram de sincronizar. " +
            (error?.message || "Tente atualizar."),
          true,
        );
        throw error;
      })
      .finally(() => {
        state.coreLoading = false;
        document.body.classList.remove("app-core-loading");
        CORE_BOOTSTRAP_PROMISE_ = null;
      });
    return CORE_BOOTSTRAP_PROMISE_;
  }

  function mergeDeferredBootstrap_(data) {
    state.bootstrap = Object.assign({}, state.bootstrap || {}, data);
    state.user = data.user || state.user || {};
    state.permissions = arr(data.permissions).length
      ? arr(data.permissions)

    state.stores = arr(data.stores);
    state.employees = arr(data.employees);
    state.timeOff = arr(data.timeOff || data.timeOffRecords);
    state.holidays = arr(data.holidays);
    state.pendingCenter.loaded = false;
    state.dashboard = data.dashboard || {};
    if (!bool(data.usersDeferred)) {

  function scheduleIdleTask_(task, timeout) {
    if (typeof window.requestIdleCallback === "function")

  function compactTurboRows_(rows, limit) {
    return arr(rows)
      .slice(0, limit || 160)
      .map((row) => {
        const compact = {};
        Object.keys(row || {}).forEach((key) => {
          const value = row[key];
          if (key === "_rowNumber") return;
          if (typeof value === "string" && value.length > 3000) return;
          compact[key] = value;
        });
        return compact;
      });
  }

  function turboUserIdentity_(user) {
    if (!user) return "";
    const keys = ["id", "usuarioId", "UsuarioID", "email", "Email"];
    for (const key of keys)
      if (user[key]) return String(user[key]).toLowerCase();
    return "";
  }

  function compactTurboTimeOff_() {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 90);
    const cutoffIso = iso(cutoff);
    return compactTurboRows_(
      state.timeOff.filter((item) => {
        const status = timeOffStatus(item),
          end = iso(
            val(item, "DataFim", "dataFim") ||
              val(item, "DataInicio", "dataInicio"),
          );
        return status === "pending" || end >= cutoffIso;
      }),
      180,
    );
  }

  function compactTurboClock_() {
    const clock = state.timeClock;
    if (!clock) return null;
    const today = iso(new Date()),
      clockDay = iso(clock.date || clock.today || today);
    if (clockDay && clockDay !== today) return null;
    return {
      _quick: true,
      _loadedAt: Date.now(),
      date: clock.date || clock.today || today,
      month: clock.month || today.slice(0, 7),
      nextAction: clock.nextAction || "",
      offToday: !!clock.offToday,
      offTodayLabel: clock.offTodayLabel || "",
      todayRecords: arr(clock.todayRecords),
      summary: clock.summary || {},
    };
  }

  function saveTurboShellCache_() {
    if (!state.user) return;
    try {

        JSON.stringify({
          version: APP_CLIENT_VERSION_,
          savedAt: Date.now(),
          user: state.user,
          permissions: arr(state.permissions),
          dashboard: state.dashboard || {},
          stores: compactTurboRows_(state.stores, 80),
          employees: compactTurboRows_(state.employees, 180),
          timeOff: compactTurboTimeOff_(),

  function restoreTurboShellCache_() {
    try {

        localStorage.getItem(TURBO_CACHE_KEY_) || "null",
      );
      if (
        !cached ||
        !cached.user ||
        cached.version !== APP_CLIENT_VERSION_ ||
        Date.now() - Number(cached.savedAt || 0) > 12 * 60 * 60 * 1000
      )
        return false;
      state.user = cached.user;
      state.permissions = arr(cached.permissions);
      state.dashboard = cached.dashboard || {};
      state.stores = arr(cached.stores);
      state.employees = arr(cached.employees);

  function ensureHouseArenaModule_() {
    if (
      typeof bindHouseArena === "function" &&
      typeof loadHouseArena === "function"
    ) {
      return Promise.resolve(true);
    }
    if (HOUSE_ARENA_MODULE_PROMISE_) return HOUSE_ARENA_MODULE_PROMISE_;
    HOUSE_ARENA_MODULE_PROMISE_ = (async () => {
      const bundle = await call(FN.clientModule, "house-arena");
      if (!bundle || !Array.isArray(bundle.css) || !Array.isArray(bundle.scripts))
        throw new Error("O módulo Arena/House Link veio incompleto.");
      if (!document.getElementById("houseArenaLazyStyles")) {
        const style = document.createElement("style");
        style.id = "houseArenaLazyStyles";
        style.textContent = bundle.css.join("\n");
        document.head.appendChild(style);
      }
      bundle.scripts.forEach((source, index) => {
        const id = "houseArenaLazyScript" + index;
        if (document.getElementById(id)) return;
        const script = document.createElement("script");
        script.id = id;
        script.textContent = String(source || "");
        document.body.appendChild(script);
      });
      if (
        typeof bindHouseArena !== "function" ||
        typeof loadHouseArena !== "function"
      ) {
        throw new Error("Não foi possível inicializar a Arena/House Link.");
      }
      bindHouseArena();
      return true;

      HOUSE_ARENA_MODULE_PROMISE_ = null;
      throw error;

  function normalizedWeekday_(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  }
  function isFixedOffDate_(employee, date) {
    const weekday = [
        "domingo",
        "segunda",
        "terça",
        "quarta",
        "quinta",
        "sexta",
        "sábado",
      ][new Date(date + "T12:00:00").getDay()],
      expected = normalizedWeekday_(weekday).slice(0, 5),
      recurring = [
        val(employee, "DiaFolgaPreferencial", "diaFolgaPreferencial"),
        val(
          employee,
          "SegundoDiaFolgaPreferencial",
          "segundoDiaFolgaPreferencial",
        ),
      ]
        .filter(Boolean)
        .some((name) => normalizedWeekday_(name).startsWith(expected));
    if (!recurring) return false;
    const employeeId = String(idOf(employee, "Funcionario"));
    return !state.timeOff.some(
      (record) =>
        String(val(record, "FuncionarioID", "funcionarioId")) === employeeId &&
        ["aprovada", "concluída"].includes(
          String(val(record, "Status", "status") || "").toLowerCase(),
        ) &&
        iso(
          val(
            record,
            "FolgaFixaSubstituidaData",
            "folgaFixaSubstituidaData",
          ),
        ) === date,
    );
  }
  function fixedEventsForDate(date, store = "", employee = "", existing = []) {
    return state.employees
      .filter(
        (x) =>
          bool(val(x, "Ativo", "ativo")) &&
          isFixedOffDate_(x, date) &&
          (!store || String(val(x, "LojaID", "lojaId")) === String(store)) &&
          (!employee || String(idOf(x, "Funcionario")) === String(employee)) &&
          !existing.some(
            (r) =>
              String(val(r, "FuncionarioID", "funcionarioId")) ===
              String(idOf(x, "Funcionario")),
          ),
      )
      .map((x) => ({
        FolgaID: `FIXA-${idOf(x, "Funcionario")}-${date}`,
        FuncionarioID: idOf(x, "Funcionario"),
        NomeFuncionario: val(x, "Nome", "nome"),
        LojaID: val(x, "LojaID", "lojaId"),
        NomeLoja: val(x, "NomeLoja", "nomeLoja"),
        DataInicio: date,
        DataFim: date,
        TipoFolga: "Folga fixa",
        Origem: "Folga fixa",
        Status: "Aprovada",
        _virtualFixed: true,
      }));

  /*
   * Mini calendário do dashboard.
   * A função considera o intervalo completo da folga e ignora registros
   * cancelados ou rejeitados. O histórico continua disponível na aba Folgas.
   */
  function renderMiniCalendar() {
    const d = new Date(
      state.calendarDate.getFullYear(),
      state.calendarDate.getMonth(),
      1,
    );
    const start = new Date(d);
    start.setDate(1 - start.getDay());
    let h = "";

    for (let i = 0; i < 35; i++) {
      const x = new Date(start);
      x.setDate(start.getDate() + i);
      const ds = iso(x);

      // Somente folgas pendentes, aprovadas ou concluídas marcam o dia.
      const has = state.timeOff.some((record) => timeOffCoversDate(record, ds));

      // Folgas fixas recorrentes continuam sendo exibidas normalmente.
      const fixed = fixedEventsForDate(ds).length > 0;

      h += `<div class="mini-day ${has || fixed ? "has-event" : ""}"><strong>${x.getDate()}</strong>${fixed ? "Folga fixa" : has ? "Folga" : ""}</div>`;
    }

    $("#dashboardMiniCalendar").innerHTML = h;
  }

    $$("[data-pending-filter]").forEach((button) => {

    });
    $$("[data-pending-category]").forEach((section) => {
      section.classList.toggle(
        "hidden",

      );

    if (!silent && window.innerWidth <= 700) {
      $("#view-pending-center .pending-center-content")?.scrollIntoView({
        behavior: "smooth",
        block: "start",
      });

  async function loadPendingCenter_(force) {
    if (!sessionToken()) return;
    renderRequests();
    populateAdvancedSelects();
    renderPendingCenterSummary_();
    if (state.pendingCenter.loading) return;
    if (state.pendingCenter.loaded && !force) {
      if (state.timeClock) renderTimeClock();
      renderSwaps();
      return;
    }
    const refresh = $("#pendingRefreshBtn");
    state.pendingCenter.loading = true;
    if (refresh) {
      refresh.disabled = true;
      refresh.textContent = "Atualizando…";
    }
    try {
      await Promise.allSettled([
        loadTimeClock(false, !!force),
        loadSwaps(),
        loadVacations_(),
      ]);
      state.pendingCenter.loaded = true;
      renderRequests();
      renderPendingCenterSummary_();
    } finally {
      state.pendingCenter.loading = false;
      if (refresh) {
        refresh.disabled = false;
        refresh.textContent = "↻ Atualizar";
      }
    }
  }

  function renderCalendar() {
    const y = state.calendarDate.getFullYear(),
      m = state.calendarDate.getMonth();
    $("#calendarTitle").textContent = state.calendarDate.toLocaleDateString(
      "pt-BR",
      { month: "long", year: "numeric" },
    );
    const first = new Date(y, m, 1);
    const start = new Date(y, m, 1 - first.getDay());
    const finish = new Date(start);
    finish.setDate(start.getDate() + 41);
    const startKey = iso(start),
      finishKey = iso(finish);
    const store = ($("#calendarStoreFilter") || {}).value || "";
    const employee = ($("#calendarEmployeeFilter") || {}).value || "";
    const eventsByDate = {};

    /*
     * Indexar uma única vez evita percorrer todo o histórico de folgas em cada
     * uma das 42 células do calendário.
     */
    state.timeOff.forEach((x) => {
      /*
       * Canceladas e rejeitadas ficam disponíveis no histórico da aba Folgas,
       * mas são descartadas antes de montar os eventos visuais do calendário.
       */
      if (!isTimeOffVisibleOnCalendar(x)) return;

      if (store && String(val(x, "LojaID", "lojaId")) !== store) return;
      if (
        employee &&
        String(val(x, "FuncionarioID", "funcionarioId")) !== employee
      )
        return;
      let from = iso(val(x, "DataInicio", "dataInicio"));
      let to = iso(val(x, "DataFim", "dataFim") || from);
      if (!from || to < startKey || from > finishKey) return;
      if (from < startKey) from = startKey;
      if (to > finishKey) to = finishKey;
      const cursor = new Date(from + "T12:00:00");
      const last = new Date(to + "T12:00:00");
      while (cursor <= last) {
        const key = iso(cursor);
        (eventsByDate[key] || (eventsByDate[key] = [])).push(x);
        cursor.setDate(cursor.getDate() + 1);
      }
    });

    let h = "",
      registeredCount = 0,
      fixedCount = 0,
      pendingCount = 0;
    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const ds = iso(d);
      let events = (eventsByDate[ds] || []).slice();
      events = events.concat(fixedEventsForDate(ds, store, employee, events));
      registeredCount += events.filter((x) => !x._virtualFixed).length;
      fixedCount += events.filter((x) => x._virtualFixed).length;
      pendingCount += events.filter(
        (x) => statusClass(val(x, "Status", "status")) === "pending",
      ).length;
      h += `<div class="calendar-day ${d.getMonth() !== m ? "other" : ""} ${ds === iso(new Date()) ? "today" : ""}" data-date="${ds}"><div class="day-number">${d.getDate()}</div>${events
        .slice(0, 4)
        .map(
          (x) => {
            const readOnly = x._virtualFixed || isKitchenChief(),
              attributes = readOnly
                ? `disabled title="${x._virtualFixed ? "Folga fixa recorrente" : "Visualização somente de leitura"}"`
                : `data-action="edit-timeoff" data-id="${esc(idOf(x, "Folga"))}"`;
            return `<button class="calendar-event ${x._virtualFixed ? "fixed" : statusClass(val(x, "Status", "status"))}" ${attributes}>${esc(val(x, "NomeFuncionario", "nomeFuncionario"))}${x._virtualFixed ? " • Fixa" : ""}</button>`;
          },
        )
        .join(
          "",
        )}${events.length > 4 ? `<span style="font-size:9px;color:var(--muted)">+${events.length - 4} mais</span>` : ""}</div>`;
    }
    $("#calendarGrid").innerHTML = h;
    $("#calendarSummary").innerHTML =
      `<span><b>${registeredCount}</b> folgas registradas</span><span><b>${fixedCount}</b> folgas fixas</span><span><b>${pendingCount}</b> pendentes</span>`;
  }

  function validateScheduleBeforeEmployeeSave(schedule) {
    const minutes = (value) => {
      const match = String(value || "").match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return NaN;
      const hour = Number(match[1]),
        minute = Number(match[2]);
      return hour <= 23 && minute <= 59 ? hour * 60 + minute : NaN;
    };
    const entry = minutes(schedule.horaEntrada);
    let exit = minutes(schedule.horaSaida);
    if (!Number.isFinite(entry) || !Number.isFinite(exit)) {
      throw new Error("Informe horários válidos para entrada e saída.");
    }
    if (exit <= entry) exit += 1440;
    if (exit - entry > 16 * 60)
      throw new Error("A jornada não pode ultrapassar 16 horas.");
    const breakMinutes = Number(schedule.duracaoIntervaloMinutos || 0);
    if (!Number.isFinite(breakMinutes) || breakMinutes < 0) {
      throw new Error("Informe uma duração de intervalo válida.");
    }
    if (breakMinutes >= exit - entry) {
      throw new Error(
        "A permanência da jornada deve ser maior que a duração do intervalo.",
      );
    }
    if (breakMinutes > 0) {
      let breakOut = minutes(schedule.horaSaidaIntervalo);
      let breakReturn = minutes(schedule.horaRetornoIntervalo);
      if (!Number.isFinite(breakOut) || !Number.isFinite(breakReturn)) {
        throw new Error(
          "Informe os horários de início e retorno do intervalo.",
        );
      }
      if (breakOut <= entry) breakOut += 1440;
      if (breakReturn <= entry) breakReturn += 1440;
      if (!(entry < breakOut && breakOut < breakReturn && breakReturn < exit)) {
        throw new Error(
          "Os horários devem seguir a ordem: entrada, intervalo, retorno e saída.",
        );
      }
    }
    return exit - entry - breakMinutes;
  }

  function syncEmployeeDailyHours_() {

        horaSaida: $("#employeeClockOut").value,

    } catch (ignored) {

      return NaN;
    }
  }

  function renderSimulationCalendar() {

      [y, m] = month.split("-").map(Number),
      start = new Date(y, m - 1, 1 - new Date(y, m - 1, 1).getDay());
    let h = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);

        ev = state.simulation.filter(
          (x) => iso(val(x, "DataSugerida", "DataInicio", "data")) === ds,
        );
      h += `<div class="calendar-day ${d.getMonth() !== m - 1 ? "other" : ""}"><div class="day-number">${d.getDate()}</div>${ev.map((x) => `<span class="calendar-event ${val(x, "FolgaFixa", "folgaFixa") ? "fixed" : ""}">${esc(simulationEmployeeName(x))}</span>`).join("")}</div>`;

  function downloadResult(data, name) {
    const url =
      typeof data === "string"
        ? data
        : val(data, "url", "downloadUrl", "dataUrl");
    if (url) {
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.download = name;
      a.click();
      return;
    }
    if (data && data.base64) {
      const binary = atob(data.base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const objectUrl = URL.createObjectURL(
        new Blob([bytes], {
          type: data.mimeType || "application/octet-stream",
        }),
      );
      const a = document.createElement("a");
      a.href = objectUrl;
      a.download = data.name || name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      return;
    }
    toast("O servidor não devolveu um arquivo para download.", true);
  }

  function sessionToken() {
    const tabToken = sessionStorage.getItem("gf-session-token") || "";
    if (tabToken) return tabToken;
    const persistent = persistentSessionToken_();
    if (persistent) {
      sessionStorage.setItem("gf-session-token", persistent);
      return persistent;
    }
    const legacy = localStorage.getItem("gf-session-token") || "";
    if (legacy) {
      localStorage.removeItem("gf-session-token");
      sessionStorage.setItem("gf-session-token", legacy);
    }
    return legacy;
  }
  function storeSessionToken_(token, remember, expiresAt) {
    const value = String(token || "");
    sessionStorage.removeItem("gf-session-token");
    localStorage.removeItem("gf-session-token");
    localStorage.removeItem(PERSISTENT_SESSION_KEY_);
    if (!value) return;
    sessionStorage.setItem("gf-session-token", value);
    const expiry = Number(expiresAt || 0),
      now = Date.now();
    if (
      remember &&
      expiry > now &&
      expiry <= now + PERSISTENT_SESSION_MAX_MS_ + 60000
    ) {
      localStorage.setItem(
        PERSISTENT_SESSION_KEY_,
        JSON.stringify({ token: value, expiresAt: expiry }),
      );
    }
  }
  function persistentSessionToken_() {
    const raw = localStorage.getItem(PERSISTENT_SESSION_KEY_);
    if (!raw) return "";
    try {
      const saved = JSON.parse(raw),
        expiry = Number(saved?.expiresAt || 0),
        token = String(saved?.token || "");
      if (
        !token ||
        expiry <= Date.now() ||
        expiry > Date.now() + PERSISTENT_SESSION_MAX_MS_ + 60000
      ) {
        localStorage.removeItem(PERSISTENT_SESSION_KEY_);
        return "";
      }
      return token;
    } catch (ignored) {
      localStorage.removeItem(PERSISTENT_SESSION_KEY_);
      return "";
    }
  }

  async function loadTimeClock(showError = true, force = false) {

  function normalizeClockDay_(value) {
    const raw = String(value || "").trim();
    const isoMatch = raw.match(/^(\d{4}-\d{2}-\d{2})/);
    if (isoMatch) return isoMatch[1];
    const brMatch = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    return brMatch ? `${brMatch[3]}-${brMatch[2]}-${brMatch[1]}` : "";
  }
  function syncClockDayToMonth_(month, reset = false) {
    const input = $("#clockDayFilter");
    if (!input) return "";
    const normalizedMonth =
      /^\d{4}-\d{2}$/.test(String(month || ""))
        ? String(month)
        : iso(new Date()).slice(0, 7);
    const today = iso(new Date()).slice(0, 10);
    input.removeAttribute("min");
    input.removeAttribute("max");
    const current = normalizeClockDay_(input.value);
    if (
      reset ||
      !current ||
      current.slice(0, 7) !== normalizedMonth
    ) {
      input.value =
        today.slice(0, 7) === normalizedMonth
          ? today
          : normalizedMonth + "-01";
    }
    return input.value;
  }

  function swapCandidateList_(value) {
    return Array.isArray(value)
      ? value

  function isFixedSwapCandidate_(timeOff) {
    return (
      val(timeOff, "TipoSelecao") === "Fixa" ||
      String(idOf(timeOff, "Folga")).startsWith("FIXA-")

  function swapWeekKey_(dateValue) {
    const date = new Date(iso(dateValue) + "T12:00:00"),
      weekday = date.getDay();
    date.setDate(date.getDate() - (weekday === 0 ? 6 : weekday - 1));
    return iso(date);
  }
  function compatibleSwapDates_(source, destination) {
    const sourceDate = iso(val(source, "DataInicio")),
      destinationDate = iso(val(destination, "DataInicio")),
      fixed =
        isFixedSwapCandidate_(source) ||
        isFixedSwapCandidate_(destination);
    if (!sourceDate || !destinationDate || sourceDate === destinationDate)
      return false;
    return !fixed || swapWeekKey_(sourceDate) === swapWeekKey_(destinationDate);
  }

  function notificationTitle_(notification) {
    return (
      String(
        val(
          notification,
          "Assunto",
          "assunto",
          "Titulo",
          "titulo",
          "title",
        ) || "",
      ).trim() || "Notificação"
    );

  function notificationPlainText_(value) {
    const source = String(value || "");
    if (!source) return "";
    const withBreaks = source
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/(?:p|div|h[1-6]|li|section|article)>/gi, "\n");
    const template = document.createElement("template");
    template.innerHTML = withBreaks;
    return String(template.content.textContent || "")
      .replace(/\u00a0/g, " ")
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n[ \t]+/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }
  function normalizeLegacyNotificationTimes_(value) {
    return String(value || "")
      .replace(
        /\b1899-12-30[T\s](\d{2}):(\d{2})(?::\d{2})?(?:\.\d+)?Z?\b/g,
        "$1:$2",
      )
      .replace(
        /\b(?:Sat\s+)?Dec\s+30\s+1899\s+(\d{2}):(\d{2})(?::\d{2})?\s+GMT[+-]\d{4}(?:\s+\([^)]+\))?/gi,
        "$1:$2",
      );
  }
  function notificationMessage_(notification) {
    const content = val(
      notification,
      "Mensagem",
      "mensagem",
      "message",
      "Texto",
      "texto",
      "Corpo",
      "corpo",
      "Descricao",
      "descricao",
    );
    if (content && typeof content === "object") {
      return (
        normalizeLegacyNotificationTimes_(
          notificationPlainText_(
            val(
              content,
              "texto",
              "Texto",
              "mensagem",
              "Mensagem",
              "conteudo",
            ) || "",
          ),
        ) || "Sem detalhes adicionais."
      );
    }
    return (
      normalizeLegacyNotificationTimes_(notificationPlainText_(content)) ||
      "Sem detalhes adicionais."
    );
  }

  function addPollOption_(value, focus) {

          ValidoAte: $("#delegationEnd").value,
          Motivo: $("#delegationReason").value,
        });
      },
      "Delegação criada.",
    );
    e.target.reset();
  }
</script>
