<style>
  :root {
    --primary: #7b68ee;
    --primary-dark: #5f4bd8;
    --primary-soft: #eeeafd;
    --bg: #f7f8fc;
    --surface: #fff;
    --surface-2: #f3f5f9;
    --text: #24223a;
    --muted: #73718a;
    --line: #e6e8ef;
    --danger: #e5484d;
    --warning: #f0a020;
    --success: #20a06b;
    --info: #3788e5;
    --shadow: 0 8px 30px rgba(39, 35, 67, 0.08);
    --radius: 14px;
    --sidebar: 248px;
    --topbar: 76px;
  }
  [data-theme="dark"] {
    --bg: #171622;
    --surface: #211f2d;
    --surface-2: #2a2837;
    --text: #f3f1fa;
    --muted: #aaa6bd;
    --line: #363344;
    --primary-soft: #342d5e;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    min-height: 100%;
    font-family:
      Inter,
      ui-sans-serif,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button {
    cursor: pointer;
  }
  .hidden {
    display: none !important;
  }
  .app-shell {
    min-height: 100vh;
  }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar);
    background: #292739;
    color: #fff;
    display: flex;
    flex-direction: column;
    z-index: 40;
    transition: 0.2s;
  }
  .sidebar-head {
    height: var(--topbar);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: linear-gradient(135deg, #9c8cff, #6d5ae6);
    color: #fff;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(123, 104, 238, 0.35);
    flex: none;
  }
  .brand-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .brand-copy strong {
    font-size: 14px;
    white-space: nowrap;
  }
  .brand-copy span {
    font-size: 11px;
    color: #aaa8ba;
    margin-top: 2px;
  }
  .sidebar-head .icon-btn {
    margin-left: auto;
    color: #d5d2e3;
  }
  .nav-list {
    padding: 12px 10px;
    overflow: auto;
    flex: 1;
  }
  .nav-item {
    width: 100%;
    height: 42px;
    border: 0;
    background: transparent;
    color: #bbb8cb;
    border-radius: 9px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    margin: 2px 0;
    text-align: left;
  }
  .nav-item span {
    font-size: 18px;
    width: 20px;
    text-align: center;
  }
  .nav-item b {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
  }
  .nav-item:hover,
  .nav-item.active {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }
  .nav-item.active {
    box-shadow: inset 3px 0 var(--primary);
  }
  .nav-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #777488;
    padding: 18px 12px 7px;
  }
  .nav-badge {
    background: #e95b70;
    color: #fff;
    border-radius: 10px;
    font-size: 10px;
    padding: 2px 6px;
    font-style: normal;
  }
  .sidebar-foot {
    padding: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .workspace {
    margin-left: var(--sidebar);
    min-height: 100vh;
    transition: 0.2s;
  }
  .topbar {
    height: var(--topbar);
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar h1 {
    font-size: 20px;
    margin: 2px 0 0;
  }
  .topbar p {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
  }
  .topbar-actions,
  .toolbar-actions,
  .hero-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .search-pill {
    height: 38px;
    min-width: 220px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
  }
  .search-pill span {
    flex: 1;
    text-align: left;
  }
  .search-pill kbd {
    font-size: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 3px 6px;
    border-radius: 5px;
  }
  .user-menu {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-left: 10px;
    border-left: 1px solid var(--line);
  }
  .user-menu > div:last-child {
    display: flex;
    flex-direction: column;
  }
  .user-menu strong {
    font-size: 12px;
  }
  .user-menu span {
    font-size: 10px;
    color: var(--muted);
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 800;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .avatar.has-hero-avatar,
  .arena-rank-avatar.has-hero-avatar,
  .house-link-avatar.has-hero-avatar {
    padding: 0;
    color: transparent;
    background: var(--surface-2);
    border: 2px solid rgba(255, 255, 255, 0.72);
    box-shadow: 0 3px 12px rgba(20, 25, 45, 0.18);
  }
  .avatar.has-hero-avatar img,
  .arena-rank-avatar.has-hero-avatar img,
  .house-link-avatar.has-hero-avatar img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .avatar-picker-section {
    margin: 0 0 22px;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
  }
  .avatar-picker-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
  }
  .avatar-picker-heading h4 { margin: 3px 0 0; font-size: 17px; }
  .avatar-picker-hint { color: var(--muted); font-size: 12px; }
  .avatar-picker {
    display: grid;
    grid-template-columns: repeat(6, minmax(54px, 1fr));
    gap: 10px;
  }
  .avatar-option {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    overflow: hidden;
    border: 3px solid transparent;
    border-radius: 16px;
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .avatar-option img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .avatar-option:hover { transform: translateY(-3px) scale(1.03); }
  .avatar-option.selected {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft), 0 8px 18px rgba(20, 25, 45, 0.2);
  }
  .avatar-option.selected::after {
    content: "✓";
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    color: white;
    background: var(--primary);
    border: 2px solid white;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 900;
  }
  @media (max-width: 700px) {
    .avatar-picker { grid-template-columns: repeat(4, minmax(52px, 1fr)); }
    .avatar-picker-heading { align-items: start; flex-direction: column; gap: 4px; }
  }
  .content {
    padding: 26px 28px 50px;
    max-width: 1700px;
    margin: auto;
  }
  .view {
    display: none;
  }
  .view.active {
    display: block;
  }
  .hero-row,
  .section-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    gap: 20px;
  }
  .hero-row h2,
  .section-toolbar h2 {
    font-size: 24px;
    margin: 3px 0 4px;
  }
  .hero-row p,
  .section-toolbar p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .eyebrow {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--primary);
  }
  .btn {
    height: 38px;
    border-radius: 9px;
    border: 1px solid transparent;
    padding: 0 14px;
    font-weight: 700;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 5px 14px rgba(123, 104, 238, 0.25);
  }
  .btn-primary:hover {
    background: var(--primary-dark);
  }
  .btn-secondary {
    background: var(--surface);
    border-color: var(--line);
    color: var(--text);
  }
  .btn-secondary:hover,
  .btn-secondary.active {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
  }
  .btn-ghost {
    background: transparent;
    color: var(--primary);
  }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .metric-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .metric-card:before {
    content: "";
    position: absolute;
    width: 4px;
    inset: 0 auto 0 0;
    background: var(--accent, var(--primary));
  }
  .metric-card span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }
  .metric-card strong {
    display: block;
    font-size: 28px;
    margin-top: 10px;
  }
  .metric-card small {
    display: block;
    color: var(--success);
    font-size: 10px;
    margin-top: 7px;
  }
  .dashboard-grid {
    display: grid;
    grid-template-columns: 2fr 2fr 1.35fr;
    gap: 16px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .span-2 {
    grid-column: span 2;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .panel-head h3,
  .panel h3 {
    margin: 3px 0;
    font-size: 15px;
  }
  .count-pill {
    background: var(--primary-soft);
    color: var(--primary);
    padding: 5px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
  }
  .mini-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .mini-day {
    min-height: 60px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px;
    font-size: 10px;
    color: var(--muted);
  }
  .mini-day strong {
    display: block;
    color: var(--text);
  }
  .mini-day.has-event {
    background: var(--primary-soft);
    border-color: transparent;
  }
  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .activity-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px;
    border-radius: 9px;
    background: var(--surface-2);
  }
  .activity-item .avatar {
    width: 30px;
    height: 30px;
    font-size: 11px;
  }
  .activity-item div:nth-child(2) {
    flex: 1;
    min-width: 0;
  }
  .activity-item strong,
  .activity-item span {
    display: block;
    font-size: 11px;
  }
  .activity-item span {
    color: var(--muted);
    margin-top: 2px;
  }
  .table-wrap {
    overflow: auto;
  }
  .table-panel {
    padding: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    white-space: nowrap;
  }
  th {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: var(--surface-2);
    text-align: left;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  tbody tr:hover {
    background: color-mix(in srgb, var(--primary-soft) 45%, transparent);
  }
  .person-cell {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .person-cell strong,
  .person-cell span {
    display: block;
  }
  .person-cell span {
    font-size: 10px;
    color: var(--muted);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 800;
  }
  .badge-approved,
  .badge-active,
  .badge-completed {
    background: #dff7ed;
    color: #16855b;
  }
  .badge-pending {
    background: #fff2d7;
    color: #a66700;
  }
  .badge-rejected,
  .badge-cancelled,
  .badge-inactive {
    background: #fde4e5;
    color: #b42d33;
  }
  .badge-fixed {
    background: #e5efff;
    color: #2769bd;
  }
  .row-actions {
    display: flex;
    gap: 5px;
    justify-content: flex-end;
  }
  .row-actions button {
    border: 0;
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 11px;
  }
  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 90px 1fr 25px;
    gap: 8px;
    align-items: center;
    font-size: 10px;
  }
  .bar-track {
    height: 7px;
    border-radius: 5px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--primary), #a38fff);
  }
  .section-toolbar select,
  .section-toolbar input,
  .form-grid input,
  .form-grid select,
  .search-input {
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    padding: 0 11px;
    font-size: 12px;
    outline: none;
  }
  .section-toolbar select:focus,
  .section-toolbar input:focus,
  .form-grid input:focus,
  .form-grid select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .calendar-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 16px;
  }
  .calendar-main {
    padding: 0;
    overflow: hidden;
  }
  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .calendar-weekdays span {
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    padding: 11px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(105px, 1fr));
  }
  .calendar-day {
    min-height: 125px;
    padding: 8px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .calendar-day:nth-child(7n) {
    border-right: 0;
  }
  .calendar-day.other {
    background: var(--surface-2);
    opacity: 0.55;
  }
  .calendar-day.today .day-number {
    background: var(--primary);
    color: #fff;
  }
  .day-number {
    width: 25px;
    height: 25px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 5px;
  }
  .calendar-event {
    display: block;
    border: 0;
    width: 100%;
    text-align: left;
    border-radius: 5px;
    padding: 4px 6px;
    margin: 3px 0;
    font-size: 9px;
    font-weight: 700;
    background: var(--primary-soft);
    color: var(--primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-left: 3px solid currentColor;
  }
  .calendar-event.pending {
    background: #fff2d7;
    color: #a66700;
  }
  .calendar-event.completed {
    background: #dff7ed;
    color: #16855b;
  }
  .calendar-event.fixed {
    background: #e5efff;
    color: #2769bd;
  }
  .calendar-event.conflict {
    background: #fde4e5;
    color: #b42d33;
  }
  .calendar-side h3 {
    margin-bottom: 12px;
  }
  .legend,
  .summary-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
  }
  .dot.amber {
    background: var(--warning);
  }
  .dot.blue {
    background: var(--info);
  }
  .dot.red {
    background: var(--danger);
  }
  .calendar-side hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 20px 0;
  }
  .request-grid,
  .store-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
  }
  .request-card,
  .store-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .request-card-head,
  .store-card-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .request-card p,
  .store-card p {
    color: var(--muted);
    font-size: 11px;
  }
  .request-card-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
  }
  .scheduler-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .form-panel h3 {
    margin-bottom: 18px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .form-grid label,
  dialog label {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .check-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 18px 0;
  }
  .check-grid label {
    font-size: 11px;
    color: var(--text);
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }
  .scheduler-help {
    background: linear-gradient(145deg, #322d5a, #292640);
    color: #fff;
  }
  .scheduler-help p,
  .scheduler-help li {
    color: #c4bfdc;
    font-size: 12px;
    line-height: 1.6;
  }
  .feature-icon {
    font-size: 28px;
    color: #a894ff;
  }
  .compact {
    margin-top: 8px;
  }
  .access-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 16px;
  }
  .large-chart {
    height: 300px;
    display: flex;
    align-items: flex-end;
    gap: 18px;
    padding: 30px;
  }
  .large-bar {
    flex: 1;
    min-width: 30px;
    background: linear-gradient(180deg, #9e8cff, var(--primary));
    border-radius: 8px 8px 3px 3px;
    position: relative;
  }
  .large-bar span {
    position: absolute;
    top: -22px;
    width: 100%;
    text-align: center;
    font-size: 10px;
  }
  .large-bar small {
    position: absolute;
    bottom: -24px;
    width: 100%;
    text-align: center;
    font-size: 9px;
    color: var(--muted);
  }
  dialog {
    width: min(680px, calc(100vw - 30px));
    max-height: 90vh;
    border: 0;
    border-radius: 16px;
    padding: 0;
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
  }
  dialog::backdrop {
    background: rgba(24, 22, 37, 0.62);
    backdrop-filter: blur(3px);
  }
  .dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 19px 22px;
    border-bottom: 1px solid var(--line);
  }
  .dialog-head h3 {
    margin: 0;
    font-size: 17px;
  }
  .dialog-body {
    padding: 20px 22px;
    overflow: auto;
  }
  .dialog-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .dialog-grid .full {
    grid-column: 1/-1;
  }
  dialog input,
  dialog select,
  dialog textarea {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    padding: 9px 11px;
    outline: none;
  }
  dialog textarea {
    min-height: 80px;
    resize: vertical;
  }
  dialog input:focus,
  dialog select:focus,
  dialog textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    padding: 15px 22px;
    border-top: 1px solid var(--line);
  }
  .switch-label {
    flex-direction: row !important;
    align-items: center;
  }
  .switch-label input {
    width: auto;
    min-height: auto;
  }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: grid;
    place-content: center;
    text-align: center;
    color: var(--muted);
  }
  .loader {
    width: 42px;
    height: 42px;
    border: 4px solid var(--primary-soft);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: auto;
  }
  .auth-state {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .auth-card {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 35px;
    text-align: center;
  }
  .auth-card .brand-mark {
    margin: auto;
  }
  .toast-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 120;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .toast {
    min-width: 280px;
    max-width: 430px;
    padding: 13px 15px;
    border-radius: 10px;
    background: #292739;
    color: #fff;
    box-shadow: var(--shadow);
    font-size: 12px;
    border-left: 4px solid var(--success);
  }
  .toast.error {
    border-color: var(--danger);
  }
  .command-palette {
    position: fixed;
    inset: 0;
    background: rgba(24, 22, 37, 0.55);
    z-index: 90;
    padding-top: 12vh;
  }
  .command-box {
    width: min(600px, calc(100% - 30px));
    margin: auto;
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }
  .command-box input {
    width: 100%;
    height: 58px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    padding: 0 18px;
    outline: 0;
  }
  .command-result {
    padding: 11px 18px;
    font-size: 12px;
  }
  .command-result:hover {
    background: var(--surface-2);
  }
  .mobile-only {
    display: none;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  body.sidebar-collapsed {
    --sidebar: 74px;
  }
  .sidebar-collapsed .brand-copy,
  .sidebar-collapsed .nav-item b,
  .sidebar-collapsed .nav-label,
  .sidebar-collapsed .nav-badge {
    display: none;
  }
  .sidebar-collapsed .sidebar-head {
    justify-content: center;
  }
  .sidebar-collapsed .sidebar-head .icon-btn {
    display: none;
  }
  .sidebar-collapsed .nav-item {
    justify-content: center;
    padding: 0;
  }
  .sidebar-collapsed .nav-item span {
    width: auto;
  }
  @media (max-width: 1100px) {
    .metric-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .dashboard-grid {
      grid-template-columns: 1fr 1fr;
    }
    .span-2 {
      grid-column: span 1;
    }
    .calendar-layout {
      grid-template-columns: 1fr;
    }
    .calendar-side {
      display: none;
    }
    .request-grid,
    .store-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .topbar .search-pill {
      min-width: 40px;
      width: 40px;
    }
    .search-pill span,
    .search-pill kbd {
      display: none;
    }
  }
  @media (max-width: 760px) {
    :root {
      --sidebar: 260px;
    }
    .sidebar {
      transform: translateX(-100%);
      box-shadow: 20px 0 60px rgba(0, 0, 0, 0.25);
    }
    body.menu-open .sidebar {
      transform: none;
    }
    .workspace {
      margin-left: 0;
    }
    .mobile-only {
      display: block;
    }
    .topbar {
      padding: 0 14px;
    }
    .topbar-actions .icon-btn:not(#refreshBtn):not(#appDownloadBtn),
    .user-menu > div:last-child {
      display: none;
    }
    .content {
      padding: 18px 14px 40px;
    }
    .hero-row,
    .section-toolbar {
      align-items: flex-start;
      flex-direction: column;
    }
    .toolbar-actions {
      width: 100%;
      overflow: auto;
    }
    .metric-grid {
      grid-template-columns: 1fr 1fr;
    }
    .dashboard-grid,
    .scheduler-grid {
      grid-template-columns: 1fr;
    }
    .request-grid,
    .store-grid {
      grid-template-columns: 1fr;
    }
    .calendar-grid {
      grid-template-columns: repeat(7, minmax(94px, 1fr));
      min-width: 660px;
    }
    .calendar-main {
      overflow: auto;
    }
    .form-grid,
    .dialog-grid,
    .check-grid {
      grid-template-columns: 1fr;
    }
    .access-metrics {
      grid-template-columns: 1fr;
    }
    .topbar .btn-primary {
      font-size: 0;
      width: 38px;
      padding: 0;
    }
    .topbar .btn-primary:first-letter {
      font-size: 16px;
    }
    .user-menu {
      padding: 0;
      border: 0;
    }
    .dialog-grid .full {
      grid-column: auto;
    }
  }
  @media (max-width: 460px) {
    .metric-grid {
      grid-template-columns: 1fr;
    }
    .hero-actions {
      width: 100%;
    }
    .hero-actions .btn {
      flex: 1;
    }
  }

  /* Login */
  .login-screen {
    min-height: 100dvh;
    background: var(--bg);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-shell {
    width: min(1080px, 100%);
    min-height: 650px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 28px 90px rgba(39, 35, 67, 0.16);
  }
  .login-brand-panel {
    position: relative;
    padding: 64px;
    background:
      radial-gradient(
        circle at 15% 10%,
        rgba(171, 151, 255, 0.35),
        transparent 35%
      ),
      linear-gradient(145deg, #302a58, #211f36);
    color: #fff;
    display: flex;
    align-items: center;
  }
  .login-brand-panel:after {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 70px;
    transform: rotate(24deg);
    right: -90px;
    bottom: -80px;
  }
  .login-brand-content {
    position: relative;
    z-index: 1;
    max-width: 430px;
  }
  .login-brand-content .brand-mark {
    width: 52px;
    height: 52px;
    margin-bottom: 55px;
  }
  .login-brand-content .eyebrow {
    color: #b6a9ff;
  }
  .login-brand-content h1 {
    font-size: 42px;
    line-height: 1.08;
    margin: 12px 0 18px;
    letter-spacing: -0.04em;
  }
  .login-brand-content > p {
    color: #c5c0da;
    line-height: 1.65;
    margin-bottom: 40px;
  }
  .login-feature {
    display: flex;
    align-items: center;
    gap: 11px;
    color: #e8e5f4;
    font-size: 13px;
    margin: 15px 0;
  }
  .login-feature i {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: rgba(123, 104, 238, 0.35);
    display: grid;
    place-items: center;
    color: #c8bfff;
    font-style: normal;
  }
  .login-form-panel {
    display: grid;

  .workspace {
    min-height: 100vh;
    margin-left: var(--sidebar);
    transition: margin 0.22s ease;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    height: var(--topbar);
    padding: 0 28px;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 88%, transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: color-mix(in srgb, var(--surface) 91%, transparent);
    box-shadow: var(--shadow-xs);
    backdrop-filter: blur(18px) saturate(1.25);
  }
  .topbar-left {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-left > div {
    min-width: 0;
  }
  .topbar h1 {
    margin: 1px 0 0;
    overflow: hidden;
    color: var(--text-strong);
    font-size: 19px;
    font-weight: 750;
    letter-spacing: -0.025em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar p {
    margin: 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
  }
  .topbar-actions,
  .toolbar-actions,
  .hero-actions {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .topbar .icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid transparent;
    border-radius: 10px;
    color: var(--muted);
    background: transparent;
  }
  .topbar .icon-btn:hover {
    border-color: var(--line);
    color: var(--text);
    background: var(--surface-2);
  }
  .topbar .user-menu {
    width: auto;
    min-width: 196px;
    max-width: 260px;
    height: 46px;
    padding: 5px 9px 5px 6px;
    border: 1px solid var(--line) !important;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
  }
  .topbar .user-menu:hover {
    border-color: var(--line-strong) !important;
    background: var(--surface-2);
  }
  .topbar .user-menu-copy {
    min-width: 0;
    display: flex !important;
    flex: 1;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    text-align: left;
  }
  .topbar .user-menu-copy strong,
  .topbar .user-menu-copy span {
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar .user-menu-copy strong {
    color: var(--text-strong);
    font-size: 11px;
  }
  .topbar .user-menu-copy span {
    color: var(--muted);
    font-size: 9px;
  }
  .topbar .user-menu-chevron {
    width: 18px;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .content {
    width: 100%;
    max-width: 1660px;
    margin: 0 auto;
    padding: 28px 30px 56px;
  }
  .view {
    display: none;
    animation: viewEnter 0.22s ease both;
  }
  .view.active {
    display: block;
  }
  @keyframes viewEnter {
    from {
      opacity: 0;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  /* Cabeçalhos de páginas */
  .hero-row,
  .section-toolbar {
    position: relative;
    min-height: 74px;
    margin: 0 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .hero-row {
    min-height: 126px;
    padding: 24px 26px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: linear-gradient(115deg, var(--surface), var(--primary-faint));
    box-shadow: var(--shadow-sm);
  }
  .hero-row:after {
    content: "";
    position: absolute;
    top: -90px;
    right: -55px;
    width: 240px;
    height: 240px;
    border: 46px solid rgba(124, 58, 237, 0.055);
    border-radius: 50%;
    pointer-events: none;
  }
  .hero-row > *,
  .section-toolbar > * {
    position: relative;
    z-index: 1;
  }
  .hero-row h2,
  .section-toolbar h2 {
    margin: 4px 0 4px;
    color: var(--text-strong);
    font-size: 25px;
    font-weight: 750;
    letter-spacing: -0.035em;
    line-height: 1.18;
  }
  .hero-row p,
  .section-toolbar p {
    max-width: 720px;
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
  }
  .eyebrow {
    color: var(--primary);
    font-size: 9px;
    font-weight: 850;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }
  .section-toolbar.compact {
    min-height: 58px;
    margin-top: 20px;
  }
  .section-toolbar > .segmented + h2 {
    flex: 1;
    text-align: center;
  }
  .advanced-view > .section-toolbar {
    min-height: 128px;
    padding: 24px 26px;
    margin-bottom: 20px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: linear-gradient(
      120deg,
      var(--surface),
      color-mix(in srgb, var(--advanced-accent) 7%, var(--surface))
    );
    box-shadow: var(--shadow-sm);
  }
  .advanced-view > .section-toolbar:before {
    width: 210px;
    height: 210px;
    right: -80px;
    top: -115px;
    background: color-mix(in srgb, var(--advanced-accent) 9%, transparent);
  }
  .advanced-view > .section-toolbar:after {
    display: none;
  }
  .advanced-view > .section-toolbar h2 {
    margin: 7px 0 5px;
    font-size: 26px;
  }
  .advanced-view > .section-toolbar .eyebrow {
    padding: 0;
    background: transparent;
    color: var(--advanced-accent);
  }
  .advanced-view > .section-toolbar .eyebrow:before {
    display: none;
  }
  .advanced-view > .section-toolbar .toolbar-actions {
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow-xs);
  }

  /* Botões e controles */
  .btn {
    min-height: 40px;
    height: auto;
    padding: 9px 14px;
    border: 1px solid transparent;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.2px;
    line-height: 1.2;
    white-space: nowrap;
    transition:
      transform 0.14s ease,
      box-shadow 0.14s ease,
      background 0.14s ease,
      border-color 0.14s ease,
      color 0.14s ease;
  }
  .btn:after {
    content: none;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
  }
  .btn:active:not(:disabled) {
    transform: translateY(0);
  }
  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }
  .btn-primary {
    border-color: var(--primary);
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, var(--primary));
    box-shadow: 0 5px 14px rgba(124, 58, 237, 0.2);
  }
  .btn-primary:hover:not(:disabled) {
    border-color: var(--primary-dark);
    background: linear-gradient(135deg, #7c3aed, var(--primary-dark));
    box-shadow: 0 7px 18px rgba(124, 58, 237, 0.26);
  }
  .btn-secondary {
    border-color: var(--line);
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
  }
  .btn-secondary:hover:not(:disabled),
  .btn-secondary.active {
    border-color: #c8b5f4;
    color: var(--primary-dark);
    background: var(--primary-faint);
  }
  .btn-ghost {
    border-color: transparent;
    color: var(--primary);
    background: transparent;
  }
  .btn-ghost:hover:not(:disabled) {
    background: var(--primary-soft);
  }
  .btn-danger {
    border-color: var(--danger);
    color: #fff;
    background: var(--danger);
    box-shadow: 0 5px 13px rgba(229, 72, 77, 0.16);
  }
  .icon-btn {
    border: 0;
    display: inline-grid;
    place-items: center;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    transition:
      background 0.15s ease,
      color 0.15s ease;
  }
  .icon-btn:hover {
    color: var(--text);
    background: var(--surface-2);
  }
  input,
  select,
  textarea {
    max-width: 100%;
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: 0;
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
    transition:
      border-color 0.15s ease,
      box-shadow 0.15s ease,
      background 0.15s ease;
  }
  input,
  select {
    min-height: 38px;
    padding: 0 11px;
  }
  textarea {
    min-height: 92px;
    padding: 10px 11px;
    resize: vertical;
  }
  input::placeholder,
  textarea::placeholder {
    color: var(--muted-2);
  }
  input:hover,
  select:hover,
  textarea:hover {
    border-color: var(--line-strong);
  }
  input:focus,
  select:focus,
  textarea:focus {
    border-color: #a78bfa;
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.11);
  }
  input[type="checkbox"],
  input[type="radio"] {
    min-height: 0;
    accent-color: var(--primary);
    box-shadow: none;
  }
  label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
  }
  label > input,
  label > select,
  label > textarea {
    width: 100%;
    margin-top: 6px;
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
  }
  .switch-label {
    min-height: 38px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    display: flex !important;
    align-items: center;
    gap: 8px;
    color: var(--text);
    background: var(--surface-2);
    font-size: 11px !important;
    text-transform: none !important;
  }
  .switch-label input {
    width: auto;
    margin: 0;
  }
  .segmented {
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    background: var(--surface-2);
  }
  .segmented button {
    min-width: 36px;
    height: 31px;
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    color: var(--muted);
    background: transparent;
    font-size: 11px;
    font-weight: 700;
  }
  .segmented button:hover {
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
  }

  /* Superfícies, métricas e tabelas */
  .panel {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }
  .panel-head {
    min-height: 34px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .panel-head h3,
  .panel h3 {
    margin: 3px 0;
    color: var(--text-strong);
    font-size: 14px;
    font-weight: 750;
    letter-spacing: -0.012em;
  }
  .metric-grid {
    grid-template-columns: repeat(5, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .metric-card {
    min-height: 116px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition:
      transform 0.16s ease,
      border-color 0.16s ease,
      box-shadow 0.16s ease;
  }
  .metric-card:hover {
    transform: translateY(-2px);
    border-color: color-mix(
      in srgb,
      var(--accent, var(--primary)) 30%,
      var(--line)
    );
    box-shadow: var(--shadow);
  }
  .metric-card:before {
    width: 3px;
    background: var(--accent, var(--primary));
  }
  .metric-card span {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
  }
  .metric-card strong {
    margin-top: 8px;
    color: var(--text-strong);
    font-size: 26px;
    font-weight: 760;
    letter-spacing: -0.035em;
  }
  .metric-card small {
    margin-top: 6px;
    color: var(--muted);
    font-size: 9px;
  }
  .count-pill {
    min-width: 24px;
    padding: 4px 8px;
    border-radius: 999px;
    color: var(--primary-dark);
    background: var(--primary-soft);
    font-size: 10px;
    font-weight: 800;
    text-align: center;
  }
  .table-panel {
    padding: 0;
    overflow: hidden;
  }
  .table-panel > .panel-head {
    margin: 0;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .table-wrap {
    overflow: auto;
    scrollbar-width: thin;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    white-space: nowrap;
  }
  th {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    background: var(--surface-2);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-align: left;
    text-transform: uppercase;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-size: 11px;
    vertical-align: middle;
  }
  tbody tr:last-child td {
    border-bottom: 0;
  }
  tbody tr {
    transition: background 0.13s ease;
  }
  tbody tr:hover {
    background: var(--primary-faint);
  }
  .person-cell {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .person-cell strong {
    color: var(--text-strong);
    font-size: 11px;
  }
  .person-cell span {
    margin-top: 2px;
    color: var(--muted);
    font-size: 9px;
  }
  .row-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
  }
  .row-actions button {
    min-height: 28px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--muted);
    background: var(--surface);
    font-size: 9px;
    font-weight: 700;
  }
  .row-actions button:hover {
    border-color: #cbbcf0;
    color: var(--primary);
    background: var(--primary-faint);
  }
  .badge {
    min-height: 22px;
    padding: 3px 8px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    font-size: 9px;
    font-weight: 800;
  }
  .badge-approved,
  .badge-active,
  .badge-completed {
    color: #147553;
    background: var(--success-soft);
  }
  .badge-pending {
    color: #a66602;
    background: var(--warning-soft);
  }
  .badge-rejected,
  .badge-cancelled,
  .badge-inactive {
    color: #b3313a;
    background: var(--danger-soft);
  }
  .badge-fixed {
    color: #2267b4;
    background: var(--info-soft);
  }
  .empty-state {
    padding: 24px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  /* Dashboard */
  .dashboard-grid {
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.5fr) minmax(260px, 1fr);
    gap: 14px;
  }
  .dashboard-grid > .panel {
    min-width: 0;
  }
  .span-2 {
    grid-column: span 2;
  }
  .mini-calendar {
    gap: 4px;
  }
  .mini-day {
    min-height: 58px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    background: var(--surface);
    font-size: 9px;
  }
  .mini-day.has-event {
    border-color: #ddd0fb;
    background: var(--primary-faint);
  }
  .activity-list {
    gap: 7px;
  }
  .activity-item {
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--surface-2);
  }
  .activity-item:hover {
    border-color: var(--line);
    background: var(--surface);
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    color: var(--primary);
    background: var(--primary-soft);
    font-size: 11px;
    font-weight: 800;
  }
  .proxima-folga {
    position: relative;
    min-height: 112px;
    margin: 0 0 16px;
    padding: 20px 23px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: var(--radius-lg);
    overflow: hidden;
    color: #fff;
    background: linear-gradient(115deg, #6d28d9, #8b5cf6 58%, #a78bfa);
    box-shadow: 0 14px 34px rgba(109, 40, 217, 0.2);
  }
  .proxima-folga:after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    right: -55px;
    top: -85px;
    border: 34px solid rgba(255, 255, 255, 0.1);
    border-radius: 50%;
  }
  .proxima-folga .dias {
    margin: 3px 0;
    font-size: 34px;
    font-weight: 780;
    letter-spacing: -0.04em;
  }
  .bar-row {
    grid-template-columns: 100px 1fr 28px;
    gap: 9px;
    font-size: 9px;
  }
  .bar-track {
    height: 7px;
    background: var(--surface-3);
  }
  .bar-fill {
    background: linear-gradient(90deg, var(--primary), #a78bfa);
  }

  /* Calendários */
  .calendar-layout {
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 14px;
  }
  .calendar-main {
    padding: 0;
    overflow: hidden;
  }
  .calendar-weekdays {
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .calendar-weekdays span {
    padding: 10px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
  }
  .calendar-grid {
    grid-template-columns: repeat(7, minmax(92px, 1fr));
  }
  .calendar-day {
    min-height: 120px;
    padding: 7px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    transition: background 0.13s ease;
  }
  .calendar-day:hover {
    background: var(--primary-faint);
  }
  .calendar-day.other {
    background: var(--surface-2);
    opacity: 0.65;
  }
  .calendar-day.today {
    box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.2);
  }
  .day-number {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    color: var(--text);
    font-size: 10px;
  }
  .calendar-day.today .day-number {
    color: #fff;
    background: var(--primary);
    box-shadow: 0 4px 10px rgba(124, 58, 237, 0.22);
  }
  .calendar-event {
    margin: 3px 0;
    padding: 4px 6px;
    border: 0;
    border-left: 2px solid var(--primary);
    border-radius: 5px;
    color: var(--primary-dark);
    background: var(--primary-soft);
    font-size: 8px;
    font-weight: 700;
  }
  .calendar-event.pending {
    border-left-color: var(--warning);
    color: #9b6105;
    background: var(--warning-soft);
  }
  .calendar-event.fixed {
    border-left-color: var(--info);
    color: #2567ad;
    background: var(--info-soft);
  }
  .calendar-side {
    height: max-content;
    position: sticky;
    top: calc(var(--topbar) + 16px);
  }
  .legend {
    gap: 10px;
  }
  .legend span {
    font-size: 10px;
  }
  .dot {
    width: 7px;
    height: 7px;
  }
  .summary-list > div {
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
  }

  /* Solicitações, lojas e formulários de operação */
  .request-grid {
    grid-template-columns: repeat(3, minmax(240px, 1fr));
    gap: 13px;
  }
  .request-card {
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease;
  }
  .request-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .request-card p {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }
  .request-card-actions {
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 7px;
  }
  .store-grid {
    grid-template-columns: repeat(3, minmax(250px, 1fr));
    gap: 14px;
  }
  .store-card-v2 {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease;
  }
  .store-card-v2:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }
  .store-visual {
    min-height: 105px;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background: linear-gradient(135deg, #4f46e5, #8b5cf6);
  }
  .store-tone-1 {
    background: linear-gradient(135deg, #087ea4, #22b8cf);
  }
  .store-tone-2 {
    background: linear-gradient(135deg, #087f5b, #34c795);
  }
  .store-tone-3 {
    background: linear-gradient(135deg, #b1600d, #f0a94a);
  }
  .store-icon {
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 13px;
    display: grid;
    place-items: center;
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
    font-size: 15px;
    font-weight: 800;
    backdrop-filter: blur(8px);
  }
  .store-body {
    padding: 17px;
  }
  .store-body h3 {
    margin: 5px 0 3px;
    font-size: 16px;
  }
  .store-location {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 10px;
  }
  .store-stats {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px;
    border-radius: 10px;
    background: var(--surface-2);
  }
  .store-stats > div {
    padding: 3px;
    text-align: center;
  }
  .store-stats strong {
    font-size: 15px;
  }
  .store-stats span {
    font-size: 8px;
  }
  .store-manager {
    margin-top: 13px;
    padding-top: 13px;
    border-top: 1px solid var(--line);
  }
  .store-actions-v2 {
    display: flex;
    gap: 7px;
    margin-top: 13px;
  }
  .store-actions-v2 .btn {
    flex: 1;
  }
  .scheduler-grid {
    grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.7fr);
    gap: 14px;
  }
  .form-panel {
    padding: 20px;
  }
  .form-panel > h3 {
    margin: 0 0 17px;
  }
  .form-grid,
  .dialog-grid {
    gap: 13px;
  }
  .check-grid {
    gap: 8px;
    margin-top: 14px;
  }
  .check-grid label {
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    background: var(--surface-2);
    font-size: 10px;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }
  .scheduler-help {
    padding: 22px;
    background: linear-gradient(145deg, var(--primary-faint), var(--surface));
  }
  .scheduler-help .feature-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--primary-soft);
    font-size: 18px;
  }
  .scheduler-help p,
  .scheduler-help li {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
  }

  /* Ponto */
  .clock-justification-note {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    white-space: normal;
  }
  .clock-layout {
    grid-template-columns: minmax(260px, 0.7fr) minmax(0, 1.3fr);
    gap: 14px;
  }
  .clock-punch-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, var(--surface), var(--primary-faint));
  }
  .clock-punch-card:after {
    content: "";
    position: absolute;
    right: -35px;
    bottom: -50px;
    width: 130px;
    height: 130px;
    border: 24px solid rgba(124, 58, 237, 0.055);
    border-radius: 50%;
  }
  .clock-live-time {
    margin: 12px 0 3px;
    color: var(--text-strong);
    font-size: 42px;
    font-weight: 780;
    letter-spacing: -0.055em;
  }
  .clock-punch-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 48px;
    margin-top: 15px;
    border-radius: 11px;
    font-size: 12px;
  }
  .clock-timeline {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .clock-mark {
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
  }
  .clock-metrics {
    grid-template-columns: repeat(3, 1fr);
    margin-top: 14px;
  }
  .clock-history-head {
    align-items: flex-end;
    gap: 20px;
  }
  .clock-history-head > div:first-child p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 11px;
  }
  .clock-day-picker {
    flex: 0 0 auto;
    min-width: 300px;
  }
  .clock-day-picker > label {
    display: block;
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .clock-day-picker > div {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .clock-day-picker input {
    min-height: 40px;
  }
  .clock-day-picker .btn {
    min-height: 40px;
  }
  .clock-request-change,
  .clock-change-grid {
    gap: 9px;
  }
  .clock-change-box {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
  }
  .clock-change-box.new {
    border-color: #cdbcf4;
    background: var(--primary-faint);
  }
  .employee-clock-dashboard {
    margin: 0 0 16px;
    border-color: #d8caf7;
    background: linear-gradient(120deg, var(--surface), var(--primary-faint));
  }

  /* Telas avançadas e comunicação */
  .advanced-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .feature-panel {
    min-height: 248px;
    padding: 19px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    gap: 12px;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }
  .feature-panel:before {
    height: 2px;
    background: linear-gradient(90deg, var(--advanced-accent), transparent 85%);
  }
  .feature-panel:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--advanced-accent) 24%, var(--line));
    box-shadow: var(--shadow);
  }
  .feature-panel .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: 0;
    color: var(--advanced-accent);
    background: color-mix(in srgb, var(--advanced-accent) 11%, var(--surface));
    box-shadow: none;
  }
  .feature-panel h3 {
    font-size: 15px;
  }
  .feature-panel label {
    gap: 0;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.04em;
  }
  .feature-panel input,
  .feature-panel select,
  .feature-panel textarea {
    min-height: 39px;
    padding: 9px 10px;
    border-radius: 9px;
    background: var(--surface-2);
  }
  .feature-panel textarea {
    min-height: 78px;
  }
  .feature-panel .btn {
    min-height: 38px;
    border-radius: 9px;
  }
  .advanced-view > .panel {
    margin-bottom: 14px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .communication-feed {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .announcement-card {
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
  }
  .announcement-card:before {
    width: 3px;
  }
  .result-list {
    gap: 7px;
  }
  .result-item {
    padding: 10px;
    border-radius: 9px;
    background: var(--surface-2);
  }
  .download-box {
    padding: 12px;
    border-radius: 10px;
  }

  /* Modais */
  dialog {
    width: min(680px, calc(100vw - 28px));
    max-height: min(88vh, 860px);
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop {
    background: rgba(18, 16, 29, 0.52);
    backdrop-filter: blur(5px);
  }
  dialog > form {
    max-height: 88vh;
    display: flex;
    flex-direction: column;
  }
  .dialog-head {
    min-height: 62px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
  }
  .dialog-head h3 {
    margin: 0;
    color: var(--text-strong);
    font-size: 16px;
    font-weight: 760;
    letter-spacing: -0.02em;
  }
  .dialog-head .icon-btn {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    background: var(--surface-2);
  }
  .dialog-body {
    overflow: auto;
    padding: 18px;
  }
  .dialog-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .dialog-grid .full {
    grid-column: 1/-1;
  }
  .dialog-section-title {
    margin: 20px 0 12px;
    padding-top: 17px;
    border-top: 1px solid var(--line);
    color: var(--text-strong);
    font-size: 11px;
  }
  .dialog-actions {
    min-height: 66px;
    padding: 13px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    background: var(--surface-2);
  }
  .profile-photo-editor {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
  }
  .profile-security-note {
    margin: 14px 0 0;
    padding: 10px 12px;
    border: 1px solid #e6dafd;
    border-radius: 9px;
    color: var(--muted);
    background: var(--primary-faint);
    font-size: 10px;
    line-height: 1.5;
  }

  /* Login, carregamento e feedback */
  .login-screen {
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(
        circle at 10% 10%,
        rgba(124, 58, 237, 0.14),
        transparent 30%
      ),
      linear-gradient(135deg, #f7f5ff, #f8f9fc 50%, #f1f4fb);
  }
  .login-shell {
    width: min(1080px, 100%);
    min-height: 650px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: 28px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 30px 90px rgba(42, 32, 83, 0.16);
  }
  .login-brand-panel {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #242033, #33265d 56%, #5b35a3);
  }
  .login-brand-panel:before,
  .login-brand-panel:after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 50px solid rgba(255, 255, 255, 0.05);
  }
  .login-brand-panel:before {
    width: 300px;
    height: 300px;
    right: -165px;
    top: -150px;
  }
  .login-brand-panel:after {
    width: 220px;
    height: 220px;
    left: -145px;
    bottom: -155px;
  }
  .login-brand-content {
    position: relative;
    z-index: 1;
    padding: 56px;
  }
  .login-group-name {
    margin-top: 15px;
    color: #fff;
    font-size: 14px;
  }
  .login-brand-content .eyebrow {
    color: #c4b5fd;
  }
  .login-brand-content h1 {
    margin: 28px 0 14px;
    color: #fff;
    font-size: 42px;
    line-height: 1.05;
    letter-spacing: -0.05em;
  }
  .login-brand-content > p {
    max-width: 430px;
    color: #c7c2d5;
    font-size: 13px;
    line-height: 1.65;
  }
  .login-feature {
    margin-top: 12px;
    color: #e8e4f2;
    font-size: 11px;
  }
  .login-feature i {
    color: #c4b5fd;
    background: rgba(196, 181, 253, 0.13);
  }
  .login-form-panel {
    padding: 44px;
    background: var(--surface);
  }
  .login-card {
    width: min(390px, 100%);
  }
  .login-card h2 {
    margin: 7px 0 7px;
    color: var(--text-strong);
    font-size: 28px;
    letter-spacing: -0.04em;
  }
  .login-card > p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.55;
  }
  .login-card label {
    margin-top: 13px;
  }
  .login-card input {
    min-height: 44px;
    border-radius: 10px;
    background: var(--surface-2);
  }
  .password-field {
    position: relative;
  }
  .password-field input {
    padding-right: 44px;
  }
  .password-field button {
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 8px;
    color: var(--muted);
    background: transparent;
  }
  .login-options {
    margin: 14px 0 20px;
  }
  .login-options label {
    margin: 0;
    color: var(--muted);
    font-size: 10px;
  }
  .login-options button {
    border: 0;
    color: var(--primary);
    background: transparent;
    font-size: 10px;
    font-weight: 700;
  }
  .login-submit {
    width: 100%;
    min-height: 46px;
    border-radius: 10px;
    font-size: 12px;
  }
  .reset-password-back {
    display: inline-flex;
    align-items: center;
    min-height: 36px;
    margin: 0 0 8px;
    padding: 0;
    border: 0;
    color: var(--primary);
    background: transparent;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .reset-password-hint {
    margin-bottom: 16px !important;
  }
  .reset-password-policy {
    display: block;
    margin: 10px 0 14px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
  }
  #resetPasswordForm .btn-ghost {
    width: 100%;
    min-height: 42px;
    margin-top: 8px;
  }
  .login-error {
    margin-top: 13px !important;
    padding: 10px 12px;
    border: 1px solid #f4c4c7;
    border-radius: 9px;
    color: #a62f37 !important;
    background: var(--danger-soft);
    font-size: 10px !important;
  }
  .loading-overlay {
    color: var(--text);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .loading-overlay p {
    margin-top: 18px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .auth-state {
    min-height: 100vh;
    padding: 24px;
    background: var(--bg);
  }
  .auth-card {
    max-width: 460px;
    padding: 34px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .toast-container {
    right: 18px;
    top: 18px;
    z-index: 10000;
    gap: 9px;
  }
  .toast {
    width: min(390px, calc(100vw - 36px));
    padding: 12px 13px;
    border: 1px solid #cbe9dc;
    border-radius: 12px;
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
  }
  .toast.error {
    border-color: #f0c3c6;
  }
  .toast-icon {
    width: 31px;
    height: 31px;
    border-radius: 9px;
    color: #fff;
    background: var(--success);
  }
  .toast.error .toast-icon {
    background: var(--danger);
  }
  .toast-copy strong {
    font-size: 11px;
  }
  .toast-copy span {
    margin-top: 2px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.45;
  }
  .toast-close {
    color: var(--muted);
  }

  /* Tema escuro */
  [data-theme="dark"] .sidebar {
    background: linear-gradient(180deg, #1c1a26, #15141d);
  }
  [data-theme="dark"] .hero-row,
  [data-theme="dark"] .clock-punch-card,
  [data-theme="dark"] .scheduler-help,
  [data-theme="dark"] .employee-clock-dashboard {
    background: linear-gradient(130deg, var(--surface), var(--primary-faint));
  }
  [data-theme="dark"] .store-visual .badge {
    color: #fff;
    background: rgba(0, 0, 0, 0.2);
  }
  [data-theme="dark"] .login-screen {
    background:
      radial-gradient(
        circle at 10% 10%,
        rgba(124, 58, 237, 0.18),
        transparent 32%
      ),
      #121119;
  }
  [data-theme="dark"] .login-brand-panel {
    background: linear-gradient(145deg, #1b1926, #35245b);
  }
  [data-theme="dark"] .profile-security-note {
    border-color: #493966;
  }

  /* Responsividade */
  @media (max-width: 1260px) {
    .metric-grid {
      grid-template-columns: repeat(3, minmax(140px, 1fr));
    }
    .dashboard-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .dashboard-grid > .span-2 {
      grid-column: span 2;
    }
    .request-grid,
    .store-grid,
    .advanced-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 1040px) {
    :root {
      --sidebar: 238px;
    }
    .content {
      padding: 24px 22px 48px;
    }
    .topbar {
      padding: 0 21px;
    }
    .calendar-layout {
      grid-template-columns: 1fr;
    }
    .calendar-side {
      position: static;
    }
    .scheduler-grid {
      grid-template-columns: 1fr;
    }
    .login-brand-content {
      padding: 42px;
    }
    .login-form-panel {
      padding: 38px;
    }
  }
  @media (max-width: 900px) {
    .sidebar {
      width: min(290px, 86vw);
      transform: translateX(-102%);
      box-shadow: 24px 0 60px rgba(0, 0, 0, 0.28);
    }
    body.menu-open .sidebar {
      transform: translateX(0);
    }
    body.menu-open:after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(17, 15, 27, 0.42);
      backdrop-filter: blur(2px);
    }
    .workspace {
      margin-left: 0;
    }
    .mobile-only {
      display: inline-grid !important;
    }
    .topbar .user-menu {
      width: 40px;
      min-width: 40px;
      max-width: 40px;
      height: 40px;
      padding: 2px;
      border: 0 !important;
      background: transparent;
      box-shadow: none;
    }
    .topbar .user-menu-copy,
    .topbar .user-menu-chevron {
      display: none !important;
    }
    .topbar .user-menu > #userAvatar {
      width: 36px;
      height: 36px;
      flex-basis: 36px;
    }
    .login-shell {
      grid-template-columns: 1fr;
      min-height: 0;
    }
    .login-brand-panel {
      display: none;
    }
    .login-form-panel {
      min-height: calc(100vh - 48px);
      padding: 34px;
      display: grid;
      place-items: center;
    }
    .mobile-login-brand {
      display: flex;
    }
  }
  @media (max-width: 700px) {
    :root {
      --topbar: 64px;
    }
    .content {
      padding: 18px 14px 38px;
    }
    .topbar {
      padding: 0 12px;
    }
    .topbar h1 {
      font-size: 16px;
    }
    .topbar p {
      display: none;
    }
    .topbar-actions {
      gap: 3px;
    }
    .topbar .icon-btn {
      width: 35px;
      height: 35px;
    }
    .hero-row,
    .section-toolbar {
      align-items: flex-start;
      flex-direction: column;
      gap: 13px;
    }
    .hero-row {
      min-height: 0;
      padding: 20px;
      border-radius: 17px;
    }
    .hero-row h2,
    .section-toolbar h2 {
      font-size: 22px;
    }
    .hero-actions,
    .toolbar-actions {
      width: 100%;
      flex-wrap: wrap;
    }
    .hero-actions > .btn,
    .toolbar-actions > .btn {
      flex: 1;
    }
    .section-toolbar > .segmented + h2 {
      text-align: left;
    }
    .section-toolbar > .segmented {
      align-self: stretch;
      justify-content: space-between;
    }
    .section-toolbar > .segmented button {
      flex: 1;
    }
    .section-toolbar select,
    .section-toolbar input,
    .search-input {
      flex: 1;
      min-width: 130px;
    }
    .metric-grid,
    .clock-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .metric-card {
      min-height: 105px;
      padding: 14px;
    }
    .metric-card strong {
      font-size: 23px;
    }
    .dashboard-grid {
      grid-template-columns: 1fr;
    }
    .dashboard-grid > .span-2 {
      grid-column: auto;
    }
    .request-grid,
    .store-grid,
    .advanced-grid,
    .communication-feed {
      grid-template-columns: 1fr;
    }
    .calendar-grid {
      min-width: 690px;
    }
    .calendar-main {
      overflow: auto;
    }
    .calendar-weekdays {
      min-width: 690px;
    }
    .clock-layout {
      grid-template-columns: 1fr;
    }
    .clock-live-time {
      font-size: 36px;
    }
    .advanced-view > .section-toolbar {
      min-height: 0;
      padding: 20px;
      border-radius: 17px;
    }
    .advanced-view > .section-toolbar .toolbar-actions {
      padding: 5px;
    }
    .feature-panel {
      min-height: 0;
    }
    dialog {
      width: calc(100vw - 18px);
      max-height: 92vh;
      border-radius: 17px;
    }
    .dialog-grid {
      grid-template-columns: 1fr;
    }
    .dialog-grid .full {
      grid-column: auto;
    }
    .dialog-actions {
      flex-wrap: wrap;
    }
    .dialog-actions .btn {
      flex: 1;
    }
    .login-screen {
      padding: 0;
    }
    .login-form-panel {
      min-height: 100vh;
      padding: 24px 18px;
    }
    .login-card h2 {
      font-size: 25px;
    }
    .toast-container {
      top: 10px;
      right: 10px;
      left: 10px;
    }
    .toast {
      width: 100%;
    }
  }
  @media (max-width: 430px) {
