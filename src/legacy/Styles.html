    .clock-metrics {
      grid-template-columns: 1fr 1fr;
    }
    .metric-card strong {
      font-size: 21px;
    }
    .hero-actions,
    .toolbar-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .hero-actions > *,
    .toolbar-actions > * {
      width: 100%;
      min-width: 0;
    }
    .form-actions {
      display: grid;
      grid-template-columns: 1fr;
    }
    .form-actions .btn {
      width: 100%;
    }
  }

  /* Botão e guia para criar atalho */
  .app-download-btn {
    height: 44px;
    max-width: 220px;
    padding: 5px 7px 5px 6px;
    border: 1px solid color-mix(in srgb, var(--primary) 30%, var(--line));
    border-radius: 13px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-strong);
    background: linear-gradient(135deg, var(--surface), var(--primary-faint));
    box-shadow: 0 7px 18px rgba(79, 49, 160, 0.11);
    cursor: pointer;
    transition:
      transform 0.16s ease,
      border-color 0.16s ease,
      box-shadow 0.16s ease;
  }
  .app-download-btn:hover {
    transform: translateY(-1px);
    border-color: var(--primary);
    box-shadow: 0 10px 24px rgba(79, 49, 160, 0.17);
  }
  .app-download-icon {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(145deg, #8b5cf6, #635bdb);
    box-shadow: 0 6px 15px rgba(99, 91, 219, 0.28);
  }
  .app-download-icon svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .app-download-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.12;
  }
  .app-download-copy strong {
    font-size: 10.5px;
    white-space: nowrap;
  }
  .app-download-copy small {
    margin-top: 2px;
    color: var(--muted);
    font-size: 8px;
    white-space: nowrap;
  }
  .app-download-arrow {
    margin: 0 3px 0 auto;
    color: var(--primary);
    font-size: 20px;
    line-height: 1;
  }
  .app-download-overlay {
    position: fixed;
    inset: 0;
    z-index: 11000;
    padding: 18px;
    display: grid;
    place-items: center;
    background: rgba(20, 18, 30, 0.58);
    backdrop-filter: blur(8px);
  }
  .app-download-sheet {
    position: relative;
    width: min(430px, 100%);
    padding: 28px;
    border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    border-radius: 24px;
    text-align: left;
    color: var(--text);
    background: var(--surface);
    box-shadow: 0 30px 90px rgba(17, 15, 27, 0.3);
  }
  .app-download-handle {
    display: none;
  }
  .app-download-close {
    position: absolute;
    right: 17px;
    top: 17px;
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    background: var(--surface-2);
    font-size: 20px;
    cursor: pointer;
  }
  .app-download-hero {
    width: 72px;
    height: 72px;
    margin-bottom: 16px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 20px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 12px 28px rgba(99, 91, 219, 0.28);
  }
  .app-download-hero img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    border-radius: 15px;
  }
  .app-download-sheet h3 {
    margin: 7px 0 7px;
    font-size: 21px;
    letter-spacing: -0.03em;
  }
  .app-download-subtitle {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.55;
  }
  .app-download-warning {
    margin: 0 0 15px;
    padding: 11px;
    display: flex;
    gap: 9px;
    border: 1px solid #f4d8a5;
    border-radius: 11px;
    color: #8a5b08;
    background: #fff8e9;
    font-size: 10.5px;
    line-height: 1.45;
  }
  .app-download-warning > span {
    width: 20px;
    height: 20px;
    flex: none;
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: #fff;
    background: #d99214;
    font-weight: 900;
  }
  .app-download-steps {
    margin: 0 0 19px;
    padding: 0;
    display: grid;
    gap: 9px;
    list-style: none;
  }
  .app-download-steps li {
    padding: 10px 11px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface-2);
    font-size: 11px;
    line-height: 1.4;
  }
  .app-download-steps li > b {
    width: 25px;
    height: 25px;
    flex: none;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--primary-soft);
  }
  .app-download-done {
    width: 100%;
    min-height: 44px;
  }
  [data-theme="dark"] .app-download-warning {
    border-color: #735a28;
    color: #f2ce87;
    background: #302718;
  }

  /* Ponto com selfie armazenada no Google Drive */
  .clock-selfie-dialog {
    width: min(500px, calc(100vw - 24px));
  }
  .clock-selfie-stage {
    position: relative;
    width: 100%;
    height: min(48vh, 430px);
    overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--primary) 28%, var(--line));
    border-radius: 18px;
    background: linear-gradient(145deg, #242033, #3d3166);
  }
  .clock-selfie-stage video,
  .clock-selfie-stage canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .clock-selfie-stage video {
    transform: scaleX(-1);
  }
  .clock-selfie-stage:after {
    content: "";
    position: absolute;
    inset: 10% 18% 12%;
    border: 2px dashed rgba(255, 255, 255, 0.62);
    border-radius: 48% 48% 42% 42%;
    pointer-events: none;
  }
  .clock-selfie-placeholder {
    position: absolute;
    inset: 0;
    z-index: 1;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    background: linear-gradient(145deg, #242033, #3d3166);
  }
  .clock-selfie-placeholder > span {
    width: 58px;
    height: 58px;
    margin-bottom: 14px;
    border-radius: 19px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.12);
    font-size: 26px;
  }
  .clock-selfie-placeholder strong {
    font-size: 14px;
  }
  .clock-selfie-placeholder small {
    margin-top: 5px;
    color: #cfc9dc;
    font-size: 10px;
  }
  .clock-selfie-badge {
    position: absolute;
    z-index: 3;
    left: 13px;
    top: 13px;
    padding: 6px 9px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    color: #fff;
    background: rgba(21, 18, 35, 0.58);
    backdrop-filter: blur(7px);
    font-size: 9px;
    font-weight: 800;
  }
  .clock-proof-list {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .clock-proof-list > div {
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface-2);
  }
  .clock-proof-list i {
    width: 24px;
    height: 24px;
    flex: none;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--success);
    background: var(--success-soft);
    font-style: normal;
    font-weight: 900;
  }
  .clock-proof-list span {
    display: flex;
    flex-direction: column;
  }
  .clock-proof-list strong {
    font-size: 9.5px;
  }
  .clock-proof-list small {
    margin-top: 2px;
    color: var(--muted);
    font-size: 8.5px;
    line-height: 1.35;
  }
  .clock-selfie-status {
    margin: 11px 0 0;
    padding: 9px 11px;
    border-radius: 9px;
    color: var(--muted);
    background: var(--primary-faint);
    font-size: 10px;
    line-height: 1.45;
  }
  .clock-selfie-actions .btn {
    min-width: 120px;
  }

  .clock-manual-notice,
  .clock-manual-footnote {
    margin: 0 0 15px;
    padding: 11px 13px;
    border: 1px solid color-mix(in srgb, var(--primary) 24%, var(--line));
    border-radius: 11px;
    color: var(--text);
    background: var(--primary-faint);
    font-size: 10px;
    line-height: 1.55;
  }
  .clock-manual-footnote {
    margin: 14px 0 0;
    color: var(--muted);
    background: var(--surface-2);
  }

  /* Trocas de folga */
  .swap-toolbar {
    padding: 22px;
    border: 1px solid color-mix(in srgb, var(--primary) 20%, var(--line));
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--surface), var(--primary-faint));
  }
  .swap-flow {
    margin: -5px 0 18px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    background: var(--surface);
    font-size: 10px;
  }
  .swap-flow span {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .swap-flow b {
    width: 23px;
    height: 23px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--primary-soft);
  }
  .swap-flow i {
    color: var(--line-strong);
    font-style: normal;
  }
  .swap-card {
    padding: 17px;
    overflow: hidden;
  }
  .swap-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .swap-card-icon {
    width: 33px;
    height: 33px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--primary-soft);
    font-size: 17px;
    font-weight: 900;
  }
  .swap-people {
    margin: 14px 0;
    display: grid;
    grid-template-columns: 1fr 25px 1fr;
    align-items: center;
    gap: 7px;
  }
  .swap-people > div {
    min-width: 0;
    display: grid;
    grid-template-columns: 31px minmax(0, 1fr);
    grid-template-rows: auto auto;
    column-gap: 8px;
  }
  .swap-people > div > span {
    grid-row: 1/3;
    width: 31px;
    height: 31px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(145deg, #8b5cf6, #635bdb);
    font-size: 9px;
    font-weight: 900;
  }
  .swap-people small {
    color: var(--muted);
    font-size: 8px;
  }
  .swap-people strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
  }
  .swap-people > i {
    text-align: center;
    color: var(--primary);
    font-style: normal;
    font-weight: 900;
  }
  .swap-dates {
    padding: 11px;
    border-radius: 11px;
    display: grid;
    grid-template-columns: 1fr 18px 1fr;
    align-items: center;
    background: var(--surface-2);
  }
  .swap-dates > div {
    display: flex;
    flex-direction: column;
  }
  .swap-dates small {
    color: var(--muted);
    font-size: 8px;
  }
  .swap-dates strong {
    margin-top: 3px;
    font-size: 11px;
  }
  .swap-dates > i {
    text-align: center;
    color: var(--primary);
    font-style: normal;
  }
  .swap-reason {
    margin: 12px 0 !important;
    color: var(--text) !important;
    font-size: 10px !important;
    line-height: 1.45;
  }
  .swap-reason > span {
    display: block;
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .swap-progress {
    height: 5px;
    margin: 12px 0 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .swap-progress i {
    border-radius: 99px;
    background: var(--line);
  }
  .swap-progress i.done {
    background: linear-gradient(90deg, #8b5cf6, #635bdb);
  }
  .swap-card .request-card-actions {
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .swap-empty {
    grid-column: 1/-1;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .swap-empty > span {
    width: 48px;
    height: 48px;
    margin-bottom: 12px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--primary-soft);
    font-size: 24px;
  }
  .swap-empty p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 10px;
  }
  .swap-dialog-intro {
    margin-bottom: 15px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 11px;
    border: 1px solid color-mix(in srgb, var(--primary) 20%, var(--line));
    border-radius: 11px;
    background: var(--primary-faint);
  }
  .swap-dialog-intro > span {
    width: 35px;
    height: 35px;
    flex: none;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: var(--primary);
    background: var(--surface);
    font-size: 18px;
  }
  .swap-dialog-intro p {
    margin: 0;
    color: var(--muted);
    font-size: 9.5px;
    line-height: 1.5;
  }

  /* Ajustes móveis */
  @media (max-width: 900px) {
    .app-download-copy small,
    .app-download-arrow {
      display: none;
    }
    .app-download-btn {
      max-width: 126px;
    }
    .app-download-copy strong {
      font-size: 9.5px;
    }
  }
  @media (max-width: 700px) {
    .app-download-btn {
      width: 37px !important;
      height: 37px !important;
      padding: 3px !important;
      border-radius: 11px !important;
    }
    .app-download-icon {
      width: 29px;
      height: 29px;
      flex-basis: 29px;
    }
    .app-download-copy,
    .app-download-arrow {
      display: none;
    }
    .app-download-overlay {
      padding: 0;
      place-items: end center;
    }
    .app-download-sheet {
      width: 100%;
      padding: 28px 20px max(26px, env(safe-area-inset-bottom));
      border-radius: 24px 24px 0 0;
    }
    .app-download-handle {
      display: block;
      width: 42px;
      height: 4px;
      margin: -15px auto 20px;
      border-radius: 99px;
      background: var(--line-strong);
    }
    .clock-selfie-dialog {
      width: calc(100vw - 14px);
      max-height: calc(100dvh - 14px);
    }
    .clock-selfie-dialog .dialog-body {
      padding: 12px;
    }
    .clock-selfie-stage {
      height: min(48dvh, 390px);
      border-radius: 14px;
    }
    .clock-proof-list {
      grid-template-columns: 1fr;
    }
    .clock-proof-list > div {
      padding: 8px;
    }
    .clock-selfie-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .clock-selfie-actions .btn {
      width: 100%;
      min-width: 0;
    }
    .clock-selfie-actions #clockSelfieConfirm {
      grid-column: 1/-1;
    }
    .swap-flow {
      justify-content: flex-start;
      overflow-x: auto;
    }
    .swap-flow i {
      display: none;
    }
    .swap-toolbar {
      padding: 18px;
    }
    .swap-toolbar > .btn {
      width: 100%;
    }
  }
  @media (max-width: 430px) {
    .swap-people {
      grid-template-columns: 1fr;
    }
    .swap-people > i {
      transform: rotate(90deg);
    }
    .swap-dates {
      grid-template-columns: 1fr 18px 1fr;
    }
  }

  /* Criador e cartões das enquetes */
  .poll-options-field {
    display: grid;
    gap: 8px;
  }
  .poll-options-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .poll-options-head label {
    margin: 0;
  }
  .poll-options-head span {
    padding: 4px 7px;
    border-radius: 999px;
    color: var(--advanced-accent);
    background: color-mix(in srgb, var(--advanced-accent) 10%, var(--surface));
    font-size: 8px;
    font-weight: 800;
  }
  .poll-option-list {
    display: grid;
    gap: 7px;
  }
  .poll-option-row {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) 32px;
    align-items: center;
    gap: 7px;
  }
  .poll-option-index {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    color: var(--advanced-accent);
    background: color-mix(in srgb, var(--advanced-accent) 11%, var(--surface));
    font-size: 9px;
    font-weight: 900;
  }
  .feature-panel .poll-option-input {
    width: 100%;
    min-width: 0;
  }
  .poll-option-row .icon-btn {

    height: 32px;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--muted);

    opacity: 0.35;
  }
  .feature-panel .poll-add-option {

    border: 1px dashed
      color-mix(in srgb, var(--advanced-accent) 35%, var(--line));
    color: var(--advanced-accent);
    background: color-mix(in srgb, var(--advanced-accent) 5%, var(--surface));

  .poll-options-field > small {

    display: flex;
    align-items: center;
    gap: 10px;
  }
  .poll-card-head > span {
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: var(--advanced-accent);
    background: color-mix(in srgb, var(--advanced-accent) 11%, var(--surface));

  .poll-card-head > div {
    min-width: 0;
    flex: 1;
  }
  .poll-card-head small {

    font-size: 7.5px;
    font-weight: 900;
    letter-spacing: 0.08em;
  }
  .poll-card-head h4 {
    margin: 2px 0 0;

  .poll-card-head em {

    font-size: 8px;

  .poll-open {

    background: #e6f8ef;
  }
  .poll-voted {

    background: var(--primary-soft);
  }
  .poll-card .poll-meta {

  }
  .poll-vote-options {

    gap: 7px;

  .poll-vote-option {
    width: 100%;
    min-height: 39px;
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
    color: var(--text);
    background: var(--surface);

  .poll-vote-option:hover {

  .poll-vote-option > span {
    width: 24px;
    height: 24px;
    flex: none;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--advanced-accent);
    background: color-mix(in srgb, var(--advanced-accent) 10%, var(--surface));
    font-size: 8px;
    font-weight: 900;

  .poll-vote-option strong {

  .poll-vote-confirmed {
