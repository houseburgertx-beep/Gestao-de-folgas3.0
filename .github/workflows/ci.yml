name: Verificar projeto

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validar permissoes reais no emulador Firebase
        run: npx --yes firebase-tools@14.22.0 emulators:exec --only database --project demo-folgas-tests --config firebase.test.json "node --import ./scripts/test-network-guard.mjs --test tests/database-rules.test.mjs"
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Testar e compilar
        run: npm run check
  notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications-worker
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: notifications-worker/package-lock.json
      - name: Instalar servico de lembretes
        run: npm ci
      - name: Testar agendamento, seguranca e envio
        run: npm test
      - name: Validar pacote sem publicar
        run: npm run check
